marketplace:
  id: enterprise-demo
  name: "Astound Digital — Platform Workspace"
  description: "The reduced Astound Digital workspace: the systemprompt admin plugin (admin skills, dashboards, and the systemprompt MCP server). The Salesforce, commons, and dev suites return in later stages — full set preserved on the backup/full-marketplace-and-skills branch."
  version: "4.0.0"
  visibility: public
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
    - systemprompt
    - admin
    - productivity
  license: proprietary
  access:
    default_included: true
    roles: [user]
    justification: "Public platform workspace for signed-in users"
  plugins:
    include:
      - astound-admin
  mcp_servers:
    source: explicit
    include:
      - systemprompt
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills and
  # artifacts only.
  agents:
    include: []

marketplace:
  id: enterprise-demo
  name: "Astound Digital — Salesforce Productivity"
  description: "A Salesforce-first workspace: plain-English assistants for your deals, accounts, contacts, leads, cases, and to-dos. One plugin per common object, each bundling skills, dashboards, and the Salesforce MCP server."
  version: "3.1.0"
  visibility: public
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
    - salesforce
    - sales
    - crm
    - productivity
  license: proprietary
  category: salesforce
  access:
    default_included: true
    roles: [user]
    justification: "Public Salesforce productivity workspace for signed-in users"
  skills:
    include:
      - cowork_setup
      - apply_brand_voice
      - format_client_document
      - draft_client_email
      - company_boilerplate
      - astound_glossary
      - salesforce_essentials
      - opportunities_find
      - opportunities_report
      - opportunities_update
      - accounts_find
      - accounts_report
      - accounts_update
      - contacts_find
      - contacts_report
      - contacts_update
      - leads_find
      - leads_report
      - leads_update
      - cases_find
      - cases_report
      - cases_update
      - activities_find
      - activities_report
      - activities_update
      # Development workflow (astound-dev plugin): plan → build → release → test
      # for Commerce Cloud / Storefront Next engagements.
      - dev_plan
      - dev_build
      - dev_release
      - dev_test
      - dev_rules
      # Development suite (astound-dev plugin) — B2C build skills.
      - b2c_business_manager_extensions
      - b2c_content
      - b2c_custom_api_development
      - b2c_custom_caches
      - b2c_custom_job_steps
      - b2c_custom_objects
      - b2c_docs
      - b2c_hooks
      - b2c_localization
      - b2c_logging
      - b2c_metadata
      - b2c_ordering
      - b2c_page_designer
      - b2c_querying_data
      - b2c_scapi_admin
      - b2c_scapi_custom
      - b2c_scapi_schemas
      - b2c_scapi_shopper
      - b2c_slas
      - b2c_slas_auth_patterns
      - b2c_webservices
      - sfcc_api_classes
      - sfcc_general_development
      # Development suite — Storefront Next build skills.
      - sfnext_authentication
      - sfnext_components
      - sfnext_configuration
      - sfnext_data_fetching
      - sfnext_deployment
      - sfnext_extensions
      - sfnext_hybrid_storefronts
      - sfnext_i18n
      - sfnext_mrt_data_store
      - sfnext_page_designer
      - sfnext_performance
      - sfnext_project_setup
      - sfnext_routing
      - sfnext_state_management
      - sfnext_tailwind
      - sfnext_test_ids
      # Development suite — operate skills.
      - atlassian
      - atlassian_doc_templating
      - b2c_am
      - b2c_cap
      - b2c_cip
      - b2c_config
      - b2c_ecdn
      - b2c_logs
      - b2c_onboarding
      - b2c_sandbox
      - b2c_sites
      - b2c_users_roles
      - b2c_webdav
      # Development suite — plan / release / test skills.
      - drawio_diagrams
      - b2c_code
      - b2c_job
      - b2c_mrt
      - b2c_site_import_export
      - git_commit
      - a11y_audit
      - code_review
      - playwright_cli
      - systematic_debugging
      # Admin control plane. Listed here so marketplace scoping keeps them in
      # the catalogue; per-entity rules in services/access-control/roles.yaml
      # restrict them to the admin role.
      - admin_workspace_setup
      - admin_user_report
      - admin_activity_report
      - analytics_dashboards
      - inspect_ai_requests
      - inspect_conversation
      - manage_permissions
      - demonstrate_governance
      - inspect_agents
      - manage_services
      - inspect_mcp_and_skills
      - systemprompt_cli
      - manage_users
      - block_users
      - manage_roles
      - manage_sessions
  plugins:
    include:
      - astound-commons
      - astound-admin
      - astound-salesforce
      - astound-dev
      - astound-salesforce-opportunities
      - astound-salesforce-accounts
      - astound-salesforce-contacts
      - astound-salesforce-leads
      - astound-salesforce-cases
      - astound-salesforce-activities
  mcp_servers:
    source: explicit
    include:
      - salesforce
      - systemprompt
      - knowledge-bank
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills, the
  # Salesforce MCP server, and artifacts only.
  agents:
    include: []

# Enterprise plan definitions and the organizations assigned to them.
#
# This file is the BOOTSTRAP source of truth. On startup the publish pipeline:
#   1. Upserts each plan by `id` into the `plans` table.
#   2. Upserts each organization by `slug` into `organizations`.
#   3. Projects every plan's `grants` into `access_control_rules` at
#      rule_type=organization, rule_value=<org slug>, for each org on that plan.
#
# Dashboard edits write to the database only — there is NO write-back to this
# file. To make a plan or an organization permanent across deployments, edit
# this file in the source repo and redeploy.
#
# A plan is not new enforcement machinery. It is a named bundle of the same
# access_control_rules rows the roles and departments files write, keyed to a
# broader subject. Enforcement is the ordinary resolver:
#
#   organization (300) -> role (200) -> department (100) -> user (0)
#
# deny-overrides, narrowest scope wins. So a customer admin can narrow what
# their plan granted, and can never widen it.
#
# Schema:
#   plans:
#     - id:          stable slug, referenced by organizations[].plan
#       name:        display name
#       description: optional free text
#       seat_limit:  max active members; omit for unlimited
#       monthly_cost_cap_usd: spend ceiling; omit for uncapped
#       monthly_cost_warn_usd: soft warning threshold; must be below the cap
#                      (and requires one). Crossing it never denies a request —
#                      the gateway records it in org_budget_warnings and the
#                      admin dashboard shows proximity. Omit for no warning.
#       monthly_price_usd: what the customer is billed per month. The cap is
#                      what they may spend, this is what they pay, and the
#                      enterprise dashboard reports the difference as margin.
#                      Omit for a non-billed plan.
#       grants:
#         - entity_type: marketplace | plugin | agent | mcp_server | skill | gateway_route | hook
#           entity_id:   string id of the entity
#           access:      allow | deny  (default: allow)
#
#   organizations:
#     - slug:   immutable; this is the rule_value grants are written against
#       name:   display name
#       plan:   plan id
#       seat_limit_override: negotiated override of the plan's seat_limit
#       email_domains: domains whose SSO arrivals join this org and consume a
#                      seat. A federated user whose domain matches nothing
#                      lands unattached: no organization, so no plan grants.
#       status: active | suspended | cancelled  (default: active)
#       platform: true on the operator's own tenant, whose members are the only
#                 callers the enterprise console answers to. Exactly one
#                 organization may set it, and no SSO arrival ever joins it —
#                 domain matching skips platform tenants, so claiming a domain
#                 cannot mint a super-admin.
#
# Suspending an organization revokes every grant at once without touching a
# rule row — the subject provider reports no organization for a non-active org,
# so its rules stop matching.
#
# Model tiering rides `gateway_route` grants: a route the organization has no
# allow rule for is not dispatchable by its members, so "Standard does not get
# Opus" is enforced at the gateway rather than hidden in the UI.

plans:
  - id: house
    name: House
    description: Astound-internal. Unlimited seats, no spend cap, everything on.
    # The admin control plane is not a marketplace: the astound-admin plugin
    # is admin-role-gated in roles.yaml, so no marketplace grant exists for it
    # and the loader rejects one as a typo'd entity id.
    grants:
      - entity_type: marketplace
        entity_id: enterprise-demo

  - id: standard
    name: Standard
    description: Salesforce plugins and the default model tier.
    seat_limit: 25
    monthly_cost_cap_usd: 2500
    monthly_price_usd: 4000
    grants:
      - entity_type: marketplace
        entity_id: enterprise-demo

  - id: enterprise
    name: Enterprise
    description: Everything in Standard, plus the admin control plane.
    seat_limit: 500
    monthly_cost_cap_usd: 50000
    monthly_price_usd: 75000
    grants:
      - entity_type: marketplace
        entity_id: enterprise-demo

  - id: pilot
    name: Pilot
    description: Evaluation tenant. Small spend cap with a soft warning, Haiku-tier only.
    seat_limit: 5
    monthly_cost_cap_usd: 2
    monthly_cost_warn_usd: 1.5
    monthly_price_usd: 0
    # No grants: the deny formerly carried here named `claude-opus-tier`, a
    # gateway_route id no profile or roles pass registers, so it never matched
    # a dispatchable route — the loader now rejects unregistered ids instead of
    # minting them. Re-add the tier deny against a real route id from the
    # profile's gateway.routes when Opus gating is wired up.
    grants: []

organizations:
  - slug: astound-digital
    name: Astound Digital
    plan: enterprise
    email_domains:
      - astounddigital.com
      - astoundcommerce.com

  - slug: systemprompt
    name: systemprompt.io
    plan: enterprise
    email_domains:
      - systemprompt.io

  - slug: pilot-labs
    name: Pilot Labs
    plan: pilot
    email_domains:
      - pilotlabs.test

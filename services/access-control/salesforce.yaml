# Salesforce-linked access grants.
#
# This file is the BOOTSTRAP source of truth for the `salesforce` subject
# dimension (rule_type=salesforce, precedence 150 — between department and
# role). On startup the governance bootstrap projects each grant into
# `access_control_rules` with rule_value=linked and default_included=false,
# and removes stale role-band grants on the same entities.
#
# The value is DERIVED, never assigned: a user holds `linked` exactly while a
# `salesforce_user_identities` row exists — written by the Salesforce SSO
# callback, removed by Disconnect on the profile page. A passkey-only account
# holds no value, matches none of these rules, and — because declaring any
# rule opts an entity out of the enterprise-demo marketplace cascade — the
# resolver default-denies every entity below. That hides the Salesforce MCP
# server, the Salesforce plugins/skills, and (via plugin gating) their
# dashboards from unlinked users, in the signed bridge manifest and at runtime
# authz alike.

grants:
  # The Salesforce Hosted MCP server. Per-user Salesforce bearer is injected
  # at call time (see services/mcp/salesforce.yaml).
  - entity_type: mcp_server
    entity_id: salesforce

  # Getting-started plugin.
  - entity_type: plugin
    entity_id: astound-salesforce
  - entity_type: skill
    entity_id: salesforce_essentials

  # Per-object plugins and their skills. Skills need their own grant: a
  # plugin-level rule does not cascade to member skills, which would otherwise
  # inherit the marketplace [user] grant from roles.yaml.
  - entity_type: plugin
    entity_id: astound-salesforce-accounts
  - entity_type: skill
    entity_id: accounts_find
  - entity_type: skill
    entity_id: accounts_report
  - entity_type: skill
    entity_id: accounts_update

  - entity_type: plugin
    entity_id: astound-salesforce-contacts
  - entity_type: skill
    entity_id: contacts_find
  - entity_type: skill
    entity_id: contacts_report
  - entity_type: skill
    entity_id: contacts_update

  - entity_type: plugin
    entity_id: astound-salesforce-leads
  - entity_type: skill
    entity_id: leads_find
  - entity_type: skill
    entity_id: leads_report
  - entity_type: skill
    entity_id: leads_update

  - entity_type: plugin
    entity_id: astound-salesforce-opportunities
  - entity_type: skill
    entity_id: opportunities_find
  - entity_type: skill
    entity_id: opportunities_report
  - entity_type: skill
    entity_id: opportunities_update

  - entity_type: plugin
    entity_id: astound-salesforce-cases
  - entity_type: skill
    entity_id: cases_find
  - entity_type: skill
    entity_id: cases_report
  - entity_type: skill
    entity_id: cases_update

  - entity_type: plugin
    entity_id: astound-salesforce-activities
  - entity_type: skill
    entity_id: activities_find
  - entity_type: skill
    entity_id: activities_report
  - entity_type: skill
    entity_id: activities_update

# Provider catalog: which models this deployment exposes, at what price, with
# what capabilities and limits. Shipped with the image alongside the agent and
# MCP trees, so every environment boots the same models and only the
# credentials named by `api_key_secret` differ.
#
# Included from services/config/config.yaml as `../ai/providers.yaml`.
# Distinct from services/ai/config.yaml, which is the AI domain's own
# configuration (per-provider toggles and defaults), not a priced catalog.

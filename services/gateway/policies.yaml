# Gateway policy baseline. Ingested into `ai_gateway_policies` at boot by the
# governance_bootstrap job (core's load_gateway_policies_from_yaml, which
# upserts every policy here by name and deletes any row this file does not
# declare). Carries quota_windows and safety config. Model exposure lives in
# the provider catalog (services/ai/providers.yaml and the profile's provider
# registry), not here.
#
# This file is the DECLARATION; the table is what the gateway enforces, and
# core re-reads it on every request (sixty-second cache). /admin/sync shows
# the two side by side as the `gateway_policies` plane: Insert only adds what
# is declared and missing, Overwrite from code repeats the boot load, Export
# renders the table back as this file.
#
# Spec fields (systemprompt_ai::GatewayPolicySpec):
#   quota_mode, quota_windows, safety { mode, scanners, block_categories,
#                                       block_response_categories, history }
#
# safety.scanners names resolve against the gateway's SafetyScannerRegistry:
# the built-in `heuristic` scanner plus any extension-registered scanner. The
# admin extension registers `secrets` and `pii_extended`
# (extensions/web/admin/src/gateway_safety.rs). A request whose content yields
# a finding in `block_categories` is denied before the upstream call, with an
# `ai_safety_findings` audit row.
#
# `block_response_categories` does the same for the reply, and applies to
# buffered replies only — a streamed reply is already on the wire when the scan
# runs, so its findings are recorded and never block.
#
# `secrets` is egress-only: it returns nothing for requests, because the
# `secret_scan` governance policy already covers ingress and runs first. Listing
# it under `block_categories` therefore does nothing — it belongs in
# `block_response_categories`. `pii_extended` scans both directions.
#
# WARN MODE. Every listed scanner runs and every finding is written to
# `ai_safety_findings` — `persist_findings` does not consult
# `block_categories`, so emptying the block lists narrows nothing about what is
# audited. `safety.mode: warn` removes every refusal on this plane while
# leaving every scanner running and every finding persisted — including the
# `blocked` column, which stays false throughout, so the report can say
# exactly how many calls each category would have refused. The block lists are
# kept intact and are the point: under enforce they are the behaviour, under
# warn they are the hypothesis being measured. Changing a list or the mode is a
# review-visible act.
#
# Why warn and not enforce: false positives on a scanner arrive as a broken
# developer workflow, one category at a time. Warn mode measures first —
# every scanner evaluates, nothing refuses, and the governance report shows
# what WOULD have blocked. Restore `mode: enforce` per plane once the numbers
# say which categories are signal.
#
# The quota windows are the third plane on an inference request and have their
# own switch, `quota_mode: warn`. Every window is still reserved against and
# every ceiling still evaluated; a breach is written to `governance_decisions`
# as a `warn` under policy `quota` instead of answering 429. Under warn a
# window is a warning threshold, never a ceiling.
#
# This pairs with `governance.mode` in services/governance/config.yaml.
# Read the planes back together:
#   systemprompt infra logs governance report --since 7d
# A category with many findings and zero blocks is one warn mode is currently
# absorbing; a category with no findings at all is a scanner earning nothing.
#
# The `heuristic` block pins the phrase list explicitly rather than inheriting
# core's builtin. As with services/governance/config.yaml, the values here ARE
# the live behaviour, never a silent core default.
#
# Costs are attributed one request late by design (a request's cost is known
# after its response), so a quota warning lands on the request after the
# breach.

policies:
  - name: default-quotas
    enabled: true
    spec:
      # Warn, never enforce — see the header. Nothing on this plane refuses.
      quota_mode: warn
      quota_windows:
        # Per user, hourly: a runaway agent is flagged within the hour without
        # any normal developer session ever tripping the threshold.
        - subject: user
          window_seconds: 3600
          max_requests: 600
          max_cost_microdollars: 20000000
        # Installation-wide, daily (core's `organization` subject is the whole
        # installation): a $200/day warning threshold.
        - subject: organization
          window_seconds: 86400
          max_cost_microdollars: 200000000
      safety:
        mode: warn
        scanners: [heuristic, secrets, pii_extended]
        # Under `mode: warn` these lists never deny; they mark which findings
        # the warnings report counts as would-have-blocked.
        block_categories: [pii_ssn]
        block_response_categories: [secret, pii_ssn]
        # Off: PII and phrase history is not rescanned. Credential scanning
        # still covers the complete provider-bound body. Entropy observations
        # never block. Every prior turn received its own PII/phrase scan.
        history: off
        heuristic:
          phrases:
            - "ignore previous instructions"
            - "ignore all previous"
            - "disregard prior instructions"
            - "forget your instructions"
            - "reveal system prompt"
            - "act as dan"
            - "developer mode enabled"
            - "pretend you have no restrictions"

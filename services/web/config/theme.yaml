# Theme Configuration
# Colors, typography, spacing, and design tokens

branding:
  # ===== CUSTOMIZE THESE FOR EACH DEMO CLIENT =====
  name: "Astound Digital"
  domain: "astounddigital.com"
  display_name: "Astound Digital"
  title: "Astound Digital — AI-Powered Commerce & Experience Solutions"
  description: "Astound Digital delivers end-to-end digital commerce, data-driven strategy, AI solutions, marketing & CRM services for global brands seeking growth and transformation."
  copyright: "2026 Astound Digital"
  tagline: "Transformation That Endures."
  themeColor: "#171717"
  platform_name: "Astound Digital"
  support_email: "ed@systemprompt.io"
  logo_light: "/files/images/logo.svg"
  logo_dark: "/files/images/logo-white.svg"
  favicon: "/files/images/favicon.ico"
  twitter_handle: "@astounddigital"
  password_hash: ""  # Set via: echo -n 'your-password' | sha256sum | cut -d' ' -f1
  session_storage_key: "astoundDemoUnlocked"
  # Legacy fields (used by public site pipeline)
  display_sitename: true
  image: "/files/images/logo.png"
  logo:
    primary:
      svg: "/files/images/logo.svg"
      webp: "/files/images/logo.webp"
      png: "/files/images/logo.png"
    dark:
      png: "/files/images/logo.png"
    small:
      png: "/files/images/logo.png"

fonts:
  body:
    family: "Inter"
    fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    files: []
  heading:
    family: "Inter"
    fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    files: []
  brand:
    family: "Inter"
    fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    files: []

# Color palette - Astound Digital monochrome (off-black on paper, red accent)
colors:
  light:
    primary:
      hsl: "hsl(0, 0%, 9%)"
      rgb: [23, 23, 23]
    secondary:
      hsl: "hsl(0, 0%, 30%)"
      rgb: [77, 77, 77]
    accent: "#fe190a"
    success: "#10b981"
    warning: "#f59e0b"
    error: "#ef4444"
    surface:
      default: "#FFFFFF"
      dark: "#f8f7f3"
      variant: "#f1efed"
      secondaryContainer: "#f1efed"
      errorContainer: "#FEE2E2"
    text:
      primary: "#171717"
      secondary: "#4d4d4d"
      inverted: "#f8f7f3"
      disabled: "#b6b6b6"
    background:
      default: "#f8f7f3"
      dark: "#f1efed"
    border:
      default: "#dddddd"
      dark: "#b6b6b6"
      outline: "#b6b6b6"

  dark:
    primary:
      hsl: "hsl(48, 26%, 96%)"
      rgb: [248, 247, 243]
    secondary:
      hsl: "hsl(0, 0%, 71%)"
      rgb: [182, 182, 182]
    accent: "#fe190a"
    success: "#34d399"
    warning: "#fbbf24"
    error: "#f87171"
    surface:
      default: "#171717"
      dark: "#0a0a0a"
      variant: "#292929"
      secondaryContainer: "rgba(254, 25, 10, 0.1)"
      errorContainer: "rgba(248, 113, 113, 0.1)"
    text:
      primary: "#f8f7f3"
      secondary: "#b6b6b6"
      inverted: "#171717"
      disabled: "#707070"
    background:
      default: "#0f0f0f"
      dark: "#0a0a0a"
    border:
      default: "rgba(255, 255, 255, 0.1)"
      dark: "#292929"
      outline: "#707070"

typography:
  sizes:
    xs: "12px"
    sm: "14px"
    md: "16px"
    lg: "18px"
    xl: "20px"
    xxl: "30px"
  weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700

spacing:
  xs: "4px"
  sm: "8px"
  md: "16px"
  lg: "24px"
  xl: "32px"
  xxl: "48px"

radius:
  xs: "2px"
  sm: "4px"
  md: "8px"
  lg: "12px"
  xl: "16px"
  xxl: "24px"
  round: "9999px"

shadows:
  light:
    sm: "0 1px 2px rgba(0, 0, 0, 0.04)"
    md: "0 4px 6px rgba(0, 0, 0, 0.07)"
    lg: "0 10px 15px rgba(0, 0, 0, 0.1)"
    accent: "0 4px 14px rgba(10, 10, 10, 0.15)"
  dark:
    sm: "0 2px 4px rgba(0, 0, 0, 0.3)"
    md: "0 4px 8px rgba(0, 0, 0, 0.4)"
    lg: "0 10px 20px rgba(0, 0, 0, 0.5)"
    accent: "0 4px 14px rgba(0, 0, 0, 0.45)"

animation:
  fast: "150ms"
  normal: "250ms"
  slow: "400ms"

zIndex:
  base: 1
  content: 10
  navigation: 100
  modal: 1000
  tooltip: 2000

layout:
  headerHeight: "72px"
  sidebarLeft:
    width: "20%"
    minWidth: "240px"
    maxWidth: "320px"
  sidebarRight:
    width: "15%"
    minWidth: "200px"
    maxWidth: "280px"
  navHeight: "72px"
  contentMaxWidth: "1200px"

card:
  radius:
    default: "16px"
    cut: "4px"
  padding:
    sm: "12px"
    md: "16px"
    lg: "24px"
  gradient:
    start: "rgba(23, 23, 23, 0.05)"
    mid: "rgba(23, 23, 23, 0.025)"
    end: "rgba(23, 23, 23, 0.01)"

mobile:
  spacing:
    xs: "4px"
    sm: "8px"
    md: "12px"
    lg: "16px"
    xl: "24px"
    xxl: "32px"
  typography:
    sizes:
      xs: "11px"
      sm: "13px"
      md: "15px"
      lg: "17px"
      xl: "19px"
      xxl: "26px"
  layout:
    headerHeight: "64px"
    navHeight: "64px"
  card:
    padding:
      sm: "10px"
      md: "12px"
      lg: "16px"

touchTargets:
  default: "44px"
  sm: "40px"
  lg: "48px"

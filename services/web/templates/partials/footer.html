<footer class="site-footer" role="contentinfo">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <div class="footer-logo">
          <img src="/files/images/logo.svg" alt="{{ORG_NAME}}" class="logo-svg logo-light" width="140" height="32" loading="lazy" />
          <img src="/files/images/logo-white.svg" alt="{{ORG_NAME}}" class="logo-svg logo-dark" width="140" height="32" loading="lazy" />
        </div>
        <p>{{site.branding.tagline}}</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{site.branding.copyright}}</p>
    </div>
  </div>
</footer>

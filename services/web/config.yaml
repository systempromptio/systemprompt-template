branding:
  name: Astound Digital
  title: "The AI Salesforce Gateway by Astound Digital"
  description: Ask your Salesforce anything in plain English, inside Claude.
    Pipeline, accounts, contacts, and client history answered in seconds,
    with every change confirmed and every action audited. AI for Salesforce,
    by Astound Digital.
  copyright: 2026 Astound Digital
  themeColor: '#171717'
  display_sitename: true
  twitter_handle: '@astounddigital'
  image: /files/images/logo.png
  logo:
    primary:
      svg: /files/images/logo.svg
      webp: /files/images/logo.webp
      png: /files/images/logo.png
    dark:
      png: /files/images/logo.png
    small:
      png: /files/images/logo.png
  favicon: /files/images/favicon.ico
fonts:
  body:
    family: Inter
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica
      Neue', Arial, sans-serif
    files: []
  heading:
    family: Inter
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica
      Neue', Arial, sans-serif
    files: []
  brand:
    family: Inter
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica
      Neue', Arial, sans-serif
    files: []

      default: '#0f0f0f'
      dark: '#0a0a0a'
    border:
      default: rgba(255, 255, 255, 0.1)
      dark: '#292929'
      outline: '#707070'
typography:
  sizes:
    xs: 12px
    sm: 14px
    md: 16px
    lg: 18px
    xl: 20px
    xxl: 30px
  weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
spacing:
  xs: 4px
  sm: 8px
  md: 16px
  lg: 24px
  xl: 32px
  xxl: 48px
radius:
  xs: 2px
  sm: 4px
  md: 8px
  lg: 12px
  xl: 16px
  xxl: 24px
  round: 9999px
shadows:
  light:
    sm: 0 1px 2px rgba(0, 0, 0, 0.04)
    md: 0 4px 6px rgba(0, 0, 0, 0.07)
    lg: 0 10px 15px rgba(0, 0, 0, 0.1)
    accent: 0 4px 14px rgba(10, 10, 10, 0.15)
  dark:
    sm: 0 2px 4px rgba(0, 0, 0, 0.3)
    md: 0 4px 8px rgba(0, 0, 0, 0.4)
    lg: 0 10px 20px rgba(0, 0, 0, 0.5)
    accent: 0 4px 14px rgba(0, 0, 0, 0.45)
animation:
  fast: 150ms
  normal: 250ms
  slow: 400ms
zIndex:
  base: 1
  content: 10
  navigation: 100
  modal: 1000
  tooltip: 2000
layout:
  headerHeight: 72px
  sidebarLeft:
    width: 20%
    minWidth: 240px
    maxWidth: 320px
  sidebarRight:
    width: 15%
    minWidth: 200px
    maxWidth: 280px
  navHeight: 72px
  contentMaxWidth: 1200px
card:
  radius:
    default: 16px
    cut: 4px
  padding:
    sm: 12px
    md: 16px
    lg: 24px
  gradient:
    start: rgba(23, 23, 23, 0.05)
    mid: rgba(23, 23, 23, 0.025)
    end: rgba(23, 23, 23, 0.01)
mobile:
  spacing:
    xs: 4px
    sm: 8px
    md: 12px
    lg: 16px
    xl: 24px
    xxl: 32px
  typography:
    sizes:
      xs: 11px
      sm: 13px
      md: 15px
      lg: 17px
      xl: 19px
      xxl: 26px
  layout:
    headerHeight: 64px
    navHeight: 64px
  card:
    padding:
      sm: 10px
      md: 12px
      lg: 16px
touchTargets:
  default: 44px
  sm: 40px
  lg: 48px
paths:
  templates: services/web/templates
  assets: services/web/assets
  css_url_prefix: /css
scripts: []
content:
  config_file: services/content/config.yaml
  sources:
  - legal
  - docs
social_action_bar:
  label: 'Follow:'
  platforms:
  - type: linkedin
  enable_share: true
nav:
  app_url: ''
  docs_url: /documentation
  blog_url: ''
  playbooks_url: ''
  github_url: ''
  getting_started_url: /documentation/connect-claude-code

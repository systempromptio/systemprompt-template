  light:
    primary:
      hsl: hsl(0, 0%, 9%)
      rgb:
      - 23
      - 23
      - 23
    secondary:
      hsl: hsl(0, 0%, 30%)
      rgb:
      - 77
      - 77
      - 77
    accent: '#fe190a'
    success: '#10b981'
    warning: '#f59e0b'
    error: '#ef4444'
    surface:
      default: '#FFFFFF'
      dark: '#f8f7f3'
      variant: '#f1efed'
      secondaryContainer: '#f1efed'
      errorContainer: '#FEE2E2'
    text:
      primary: '#171717'
      secondary: '#4d4d4d'
      inverted: '#f8f7f3'
      disabled: '#b6b6b6'
    background:
      default: '#f8f7f3'
      dark: '#f1efed'
    border:
      default: '#dddddd'
      dark: '#b6b6b6'
      outline: '#b6b6b6'
  dark:
    primary:
      hsl: hsl(48, 26%, 96%)
      rgb:
      - 248
      - 247
      - 243
    secondary:
      hsl: hsl(0, 0%, 71%)
      rgb:
      - 182
      - 182
      - 182
    accent: '#fe190a'
    success: '#34d399'
    warning: '#fbbf24'
    error: '#f87171'
    surface:
      default: '#171717'
      dark: '#0a0a0a'
      variant: '#292929'
      secondaryContainer: rgba(254, 25, 10, 0.1)
      errorContainer: rgba(248, 113, 113, 0.1)
    text:
      primary: '#f8f7f3'
      secondary: '#b6b6b6'
      inverted: '#171717'
      disabled: '#707070'

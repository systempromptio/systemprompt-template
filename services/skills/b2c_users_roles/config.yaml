description: "Manage Business Manager (BM) instance-level roles and permissions with the b2c cli — create/delete custom BM roles, assign/unassign users to roles on an instance, and get/set role permissions (functional, module, locale, webdav). Use for anything scoped to a specific Commerce Cloud instance's Business Manager roles. For Account Manager (AM) users, roles, organizations, and API clients, use the b2c-am skill instead."

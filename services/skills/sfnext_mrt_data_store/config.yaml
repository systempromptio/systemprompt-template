id: sfnext_mrt_data_store
name: "Storefront Next MRT Data Store"
description: "Read MRT Data Store custom site/global preferences in Storefront Next WITHOUT hitting the two traps — the \"flat locally, array in prod\" shape mismatch AND (SDK ≥1.0.0) the \"getSitePreferences returns {} even though the middleware ran\" context-ownership mismatch. Use when reading site preferences via getSitePreferences/getCustomGlobalPreferences, registering the data-store middleware in root.tsx, surfacing a BM site pref (public site key, feature flag) to loaders/actions, or debugging a preference that is set in Business Manager but reads as undefined/empty on a deployed environment (or broke after a Storefront Next SDK upgrade). NOT for PUBLIC__/config.server.ts app config — see sfnext-configuration."

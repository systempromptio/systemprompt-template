plugin:
  id: astound-salesforce-cases
  name: "Salesforce — Support Cases"
  description: "Work with your Salesforce support cases: find cases, read your queue and backlog, and safely create and update cases"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [salesforce, cases, support, service, escalation]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - cases_find
      - cases_report
      - cases_update
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # Selection is plugin-driven (core's selected_artifact_ids), so an artifact
  # reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - cases-support-queue

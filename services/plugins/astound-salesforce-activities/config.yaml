plugin:
  id: astound-salesforce-activities
  name: "Salesforce — Tasks, Calls & Meetings"
  description: "Work with your Salesforce activities: find what's due and overdue, read your day and week at a glance, and safely log calls, set follow-ups, and schedule meetings"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [salesforce, activities, tasks, calendar, meetings]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - activities_find
      - activities_report
      - activities_update
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # Selection is plugin-driven (core's selected_artifact_ids), so an artifact
  # reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - activities-tasks-and-meetings

plugin:
  id: astound-admin
  name: "Astound Admin — Control Plane"
  description: "Admin-only control plane: who is using the platform, what it costs, what failed, and why. Ships the systemprompt CLI server plus governance, analytics, and operations skills, and three live dashboards."
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [admin, governance, analytics, users, audit, operations, control-plane]
  license: proprietary
  category: admin
  skills:
    source: explicit
    include:
      - admin_workspace_setup
      - admin_user_report
      - admin_activity_report
      - analytics_dashboards
      - inspect_ai_requests
      - inspect_conversation
      - manage_permissions
      - demonstrate_governance
      - inspect_agents
      - manage_services
      - inspect_mcp_and_skills
      - systemprompt_cli
      # User management (mutations; admin_user_report stays read-only)
      - manage_users
      - block_users
      - manage_roles
      - manage_sessions
  # The Slack-facing operator agent. It declares its own admin-only rule in
  # services/access-control/roles.yaml, which opts it out of the marketplace
  # cascade the same way every other member of this plugin does.
  agents:
    source: explicit
    include:
      - admin_console
  # The admin CLI-passthrough server. Gated to the admin role twice over: an
  # entity rule in services/access-control/roles.yaml keeps it out of a
  # non-admin's signed manifest, and oauth.scopes in services/mcp/systemprompt.yaml
  # rejects the call at runtime if it gets there anyway.
  mcp_servers:
    source: explicit
    include:
      - systemprompt
  content_sources: {}
  # Dashboards seeded into the Cowork Artifacts library for users of this
  # plugin. Selection is plugin-driven (core's selected_artifact_ids), so an
  # artifact reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - admin-users-directory
      - admin-activity-requests
      - admin-usage-costs
  # Claude Code runs plugin hooks session-globally, so the governance hooks
  # are declared once here and cover every tool call in the session. This
  # ownership moved from astound-commons when the marketplace was reduced
  # (backup/full-marketplace-and-skills) — no other plugin should set this:
  # each extra owner is another govern call per tool.
  hooks:
    governance: true

plugin:
  id: astound-dev
  name: "Development — Commerce Cloud Workflow"
  description: "Astound's development suite for Salesforce Commerce Cloud / Storefront Next projects: the four workflow entry points (plan, build, release, test), the house rules, and the full B2C/Storefront Next skill library — build, operate, release, and test skills ported from the sfcc-next-cursor suite."
  version: "2.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [development, storefront-next, commerce-cloud, b2c, scapi, playwright, workflow]
  license: proprietary
  category: development
  skills:
    source: explicit
    include:
      # Workflow entry points + house rules
      - dev_plan
      - dev_build
      - dev_release
      - dev_test
      - dev_rules
      # Build — B2C Commerce
      - b2c_business_manager_extensions
      - b2c_content
      - b2c_custom_api_development
      - b2c_custom_caches
      - b2c_custom_job_steps
      - b2c_custom_objects
      - b2c_docs
      - b2c_hooks
      - b2c_localization
      - b2c_logging
      - b2c_metadata
      - b2c_ordering
      - b2c_page_designer
      - b2c_querying_data
      - b2c_scapi_admin
      - b2c_scapi_custom
      - b2c_scapi_schemas
      - b2c_scapi_shopper
      - b2c_slas
      - b2c_slas_auth_patterns
      - b2c_webservices
      - sfcc_api_classes
      - sfcc_general_development
      # Build — Storefront Next
      - sfnext_authentication
      - sfnext_components
      - sfnext_configuration
      - sfnext_data_fetching
      - sfnext_deployment
      - sfnext_extensions
      - sfnext_hybrid_storefronts
      - sfnext_i18n
      - sfnext_mrt_data_store
      - sfnext_page_designer
      - sfnext_performance
      - sfnext_project_setup
      - sfnext_routing
      - sfnext_state_management
      - sfnext_tailwind
      - sfnext_test_ids
      # Operate
      - atlassian
      - atlassian_doc_templating
      - b2c_am
      - b2c_cap
      - b2c_cip
      - b2c_config
      - b2c_ecdn
      - b2c_logs
      - b2c_onboarding
      - b2c_sandbox
      - b2c_sites
      - b2c_users_roles
      - b2c_webdav
      # Plan
      - drawio_diagrams
      # Release
      - b2c_code
      - b2c_job
      - b2c_mrt
      - b2c_site_import_export
      - git_commit
      # Test
      - a11y_audit
      - code_review
      - playwright_cli
      - systematic_debugging
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}

plugin:
  id: astound-salesforce-opportunities
  name: "Salesforce — Sales Pipeline & Deals"
  description: "Work with your Salesforce opportunities: find deals, read your pipeline and forecast, and safely create and update deals"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [salesforce, opportunities, pipeline, sales, forecast]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - opportunities_find
      - opportunities_report
      - opportunities_update
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # Selection is plugin-driven (core's selected_artifact_ids), so an artifact
  # reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - pipeline-open-deals

plugin:
  id: astound-commons
  name: "Astound Commons — Workspace Setup"
  description: "First-run workspace setup (installs the Salesforce dashboards into your Artifacts library) plus shared brand skills: voice, document formatting, client email, company boilerplate, and terminology"
  version: "2.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [setup, onboarding, artifacts, brand, voice, formatting, email, glossary]
  license: proprietary
  category: setup
  skills:
    source: explicit
    include:
      - cowork_setup
      - apply_brand_voice
      - format_client_document
      - draft_client_email
      - company_boilerplate
      - astound_glossary
  agents:
    source: explicit
    include: []
  mcp_servers: {}
  content_sources: {}
  # The client-facing dashboards cowork_setup installs. The skill's primary
  # channel is skills/cowork-setup/assets/artifacts/ (staged by
  # scripts/generate-cowork-setup-assets.py, VM-mounted, bash-copyable); the
  # artifacts/<id>.json records this selection emits into the bundle are the
  # fallback. The admin-* dashboards belong to astound-admin, which selects
  # them itself.
  artifacts:
    source: explicit
    include:
      - accounts-book-of-business
      - activities-tasks-and-meetings
      - cases-support-queue
      - contacts-people
      - leads-inbound-prospects
      - pipeline-open-deals
  # Claude Code runs plugin hooks session-globally, so the governance hooks are
  # declared once here and cover every tool call in the session. No other
  # plugin should set this — each extra owner is another govern call per tool.
  hooks:
    governance: true

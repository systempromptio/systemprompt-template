plugin:
  id: astound-salesforce-accounts
  name: "Salesforce — Accounts & Customers"
  description: "Work with your Salesforce accounts: find customers, get a 360° briefing before a call, and safely create and update account records"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [salesforce, accounts, customers, sales, briefing]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - accounts_find
      - accounts_report
      - accounts_update
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # Selection is plugin-driven (core's selected_artifact_ids), so an artifact
  # reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - accounts-book-of-business

plugin:
  id: astound-salesforce-contacts
  name: "Salesforce — Contacts & People"
  description: "Work with the people in your Salesforce: find contacts, get briefed on who you know at an account, and safely create and update contact records"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [salesforce, contacts, people, accounts, crm]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - contacts_find
      - contacts_report
      - contacts_update
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # Selection is plugin-driven (core's selected_artifact_ids), so an artifact
  # reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - contacts-people

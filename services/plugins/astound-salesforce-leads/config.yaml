plugin:
  id: astound-salesforce-leads
  name: "Salesforce — Leads & Prospects"
  description: "Work with your Salesforce leads: find and filter prospects, read your funnel insights, and safely capture and update leads"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [salesforce, leads, prospects, sales, marketing]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - leads_find
      - leads_report
      - leads_update
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # Selection is plugin-driven (core's selected_artifact_ids), so an artifact
  # reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - leads-inbound-prospects

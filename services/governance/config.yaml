# Governance policy chain — ENABLED in this installation (REQ-041, switched on
# 2026-08-25 for the enterprise rollout after the evaluation phase ran it
# disabled). All four stages run synchronously before every tool dispatch,
# first-deny-wins, every decision audited to governance_decisions.
#
# Do not disable governance by deleting this file or emptying `policies`: a
# missing or malformed file falls back to GovernanceConfig::defaults(), which is
# all four stages ENABLED with default tunables. Explicit `enabled: false` per
# stage is the only reliable off.
#
# The gateway safety scanners are a second, independent plane — see
# services/gateway/policies.yaml. They are switched on there too.

governance:
  policies:
  - id: secret_scan
    enabled: true
    # The 32 vendor patterns (AWS, GitHub, Stripe, sk-ant-, PEM, DB URLs) are
    # fixed. The high-entropy backstop that catches prefixless keys is tunable
    # here. The block is explicit — the values below ARE the live behaviour,
    # never a silent core default (2026-08-26: an SRI hash in forwarded page
    # assets tripped the backstop and denied every gateway prompt).
    entropy:
      enabled: true      # false keeps the vendor patterns, drops the backstop
      min_len: 32
      threshold: 0.80    # Shannon entropy / the token length's ceiling
      # Regexes; a matching token is never reported. SRI integrity hashes are
      # public metadata — core also length-verifies sha256/384/512- digests,
      # this entry keeps the exemption effective on an unpatched binary.
      allowlist:
      - '^sha(256|384|512)-[A-Za-z0-9+/=_-]+$'
  - id: scope_check
    enabled: true
    admin_only_prefixes:
    - mcp__systemprompt__
  - id: tool_blocklist
    enabled: true
    patterns:
    - delete
    - drop
    - destroy
  - id: rate_limit
    enabled: true
    requests_per_window: 300
    window_secs: 60

# Postgres plus one flavour's image. Parameters: FLAVOUR (default full),
# IMAGE (default systemprompt-template:<FLAVOUR>), HTTP_PORT (default 8080).
#   FLAVOUR=full docker compose -p sp-full up
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: systemprompt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-systemprompt}
      POSTGRES_DB: systemprompt
    volumes:
      # postgres:18+ images store data under major-version subdirectories of
      # /var/lib/postgresql — mounting the old .../data path aborts startup.
      - postgres_data:/var/lib/postgresql
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemprompt -d systemprompt"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # One file for every flavour: FLAVOUR picks the locally built image
    # (`just docker-build <flavour>`), IMAGE names any other one, e.g.
    # ghcr.io/systempromptio/systemprompt-template:latest.
    image: ${IMAGE:-systemprompt-template:${FLAVOUR:-full}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL to an address you control}
      DATABASE_URL: postgres://systemprompt:${POSTGRES_PASSWORD:-systemprompt}@postgres:5432/systemprompt
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - app_web:/app/web
      - app_storage_data:/app/storage/data
      - app_profiles:/app/.systemprompt/profiles/docker

volumes:
  postgres_data:
  app_web:
  app_storage_data:
  app_profiles:

# Build settings for the Android app. Nothing machine-specific and no secret
# belongs here: the SDK location is ANDROID_HOME or the untracked
# local.properties, and signing values are read from an untracked
# keystore.properties (packaging/mobile/android/).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The binding library of the phone apps.
#
# Kept as a SEPARATE workspace (the root [workspace] lists it under `exclude`)
# with its own Cargo.lock, so the server image never compiles the binding
# generator or a phone target, and the phone build never compiles the server
# closure. Its one package links core's `systemprompt-mobile` crate, which
# annotates the shared surface, adds the fork's own annotated items, and
# builds the single library both apps load: a shared library per Android ABI
# and a static library for iOS. The Kotlin and Swift that call it are
# generated from that library by the `uniffi-bindgen` binary below and are
# never committed (../shared/build-android.sh).
#
# The core entry is a git dependency on the rev in bridge/CORE_REF, in the
# same form as the root's core entries; scripts/core-pin.sh moves and checks
# it with them.
#
# rust-toolchain.toml, rustfmt.toml, clippy.toml and deny.toml are the
# template's: rustup, rustfmt, clippy and cargo-deny each find them by walking
# up from this directory, the same way the tests/ workspace does.
[workspace]
members = ["."]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.70.0"
authors = ["systemprompt.io <ed@systemprompt.io>"]
license = "MIT"
repository = "https://github.com/systempromptio/systemprompt-template"
homepage = "https://systemprompt.io"
documentation = "https://systemprompt.io/documentation"

[workspace.dependencies]
systemprompt-mobile = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "c1d24b20a112789125eb334d88045ef41aad14a3" }
uniffi = "0.33"
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

# What a phone ships: small, and with the symbols the generator reads left in
# the dynamic table (strip removes only debug information and the static
# symbol table).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"

[profile.dev]
debug = "line-tables-only"

[package]
name = "systemprompt-mobile-app"
description = "The binding library of the Enterprise Demo phone apps: core's shared surface plus the fork's own, in one library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

# The generator is a host tool: the feature keeps its command-line
# dependencies out of every phone build.
[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]

[dependencies]
systemprompt-mobile = { workspace = true }
uniffi = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
rustls-platform-verifier = { workspace = true }

[lints]
workspace = true

# The root workspace's lint table, unchanged. [workspace.lints] is read per
# workspace, so this one carries its own copy; keep the two identical.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
return_self_not_must_use = "allow"
must_use_candidate = "allow"
trivially_copy_pass_by_ref = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
format_push_string = "allow"
uninlined_format_args = "allow"
result_unit_err = "allow"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
derive_partial_eq_without_eq = "allow"
cognitive_complexity = "allow"
unwrap_or_default = "allow"
redundant_pub_crate = "allow"

too_many_arguments = "deny"
type_complexity = "warn"
too_many_lines = "warn"
inefficient_to_string = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

if_not_else = "warn"
redundant_else = "warn"
manual_let_else = "warn"
match_bool = "warn"
option_if_let_else = "warn"
needless_pass_by_value = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"

or_fun_call = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"
implicit_clone = "warn"
large_futures = "warn"

match_wild_err_arm = "warn"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
exit = "deny"
rc_mutex = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
lossy_float_literal = "deny"
read_zero_byte_vec = "deny"
path_buf_push_overwrite = "deny"
verbose_file_reads = "deny"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"
clone_on_ref_ptr = "warn"
separated_literal_suffix = "warn"
try_err = "warn"

map_err_ignore = "warn"
str_to_string = "warn"
undocumented_unsafe_blocks = "warn"
self_named_module_files = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

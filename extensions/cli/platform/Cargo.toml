[package]
name = "systemprompt-cli-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI extension: grant, revoke and inspect platform-organization membership — the second half of platform admin."
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "systemprompt_cli_platform"
path = "src/lib.rs"

[[bin]]
name = "systemprompt-cli-platform"
path = "src/main.rs"

[dependencies]
# The membership queries live with the rest of the organization code in the
# admin extension; this crate is only an argument parser around them.
systemprompt-web-admin = { workspace = true }

# Why: membership is written to the platform database. Bootstrapping through
# the core facade rather than reading DATABASE_URL directly is deliberate —
# `plugins run` forwards SYSTEMPROMPT_PROFILE for every operator, DATABASE_URL
# only for the one who set the machine up.
systemprompt = { workspace = true, features = ["full"] }

clap = { version = "4", features = ["derive"] }
sqlx = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

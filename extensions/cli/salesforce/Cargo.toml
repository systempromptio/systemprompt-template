[package]
name = "systemprompt-cli-salesforce"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI extension for the systemprompt.io template: export, diff and apply Salesforce org configuration as code."
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "systemprompt_cli_salesforce"
path = "src/lib.rs"

[[bin]]
name = "systemprompt-cli-salesforce"
path = "src/main.rs"

[dependencies]
# The export/diff/apply implementation lives with the rest of the Salesforce
# code in the admin extension; this crate is only an argument parser around it.
systemprompt-web-admin = { workspace = true }

# Why: `apply` reads the Salesforce usernames to assign from the platform
# database. Bootstrapping through the core facade rather than reading
# DATABASE_URL directly is deliberate — `plugins run` forwards DATABASE_URL only
# when the parent process already had it set, but always forwards
# SYSTEMPROMPT_PROFILE, so this is the route that works for every operator
# rather than only the one who set the machine up.
systemprompt = { workspace = true, features = ["full"] }

clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }

[lints]
workspace = true

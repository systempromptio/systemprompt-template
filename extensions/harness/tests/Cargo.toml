# Test workspace for the desktop shell.
#
# Kept as a SEPARATE workspace (extensions/harness/Cargo.toml lists it under
# `exclude`), the way the root workspace keeps tests/: it has its own
# Cargo.lock and its own lint table, so test code may assert by panicking
# while the five shell crates stay under the production table. The seven
# crates test the shell crates through their public API.
#
# Run:  bash scripts/harness/cargo.sh test   (shell workspace, then this one)
#
# Core is named exactly as the shell manifest names it, one rev for both;
# scripts/core-pin.sh moves the two together. The toolchain is the shell's
# (../rust-toolchain.toml, found by rustup walking up from here), and both
# workspaces build into extensions/harness/target (scripts/harness/cargo.sh).
[workspace]
members = [
    "harness-brain-ui-tests",
    "harness-desktop-tests",
    "harness-drive-ui-tests",
    "harness-notifications-ui-tests",
    "harness-shell-tests",
    "harness-ui-tests",
    "migrated/desktop/app",
    "migrated/desktop/process",
    "migrated/desktop/session",
    "sp-brand-tests",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.0.0"
authors = ["systemprompt.io <ed@systemprompt.io>"]
license = "MIT"
publish = false
repository = "https://github.com/systempromptio/systemprompt-template"
homepage = "https://systemprompt.io"

# The shell's own denies hold in its tests too: a test reports a failed step
# through its Result or an assertion, never through unwrap, expect or panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
# The shell crates under test (paths relative to this directory).
systemprompt-harness-brand = { path = "../brand" }
systemprompt-harness-theme = { path = "../theme" }
systemprompt-harness-shared = { path = "../shared" }
systemprompt-harness-views = { path = "../views" }
systemprompt-harness-shell = { path = "../shell" }

systemprompt-device = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "608f8cab347836163d018031ef6571af4bdf4f5d" }
systemprompt-drive = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "608f8cab347836163d018031ef6571af4bdf4f5d" }
systemprompt-engine = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "608f8cab347836163d018031ef6571af4bdf4f5d" }
systemprompt-harness = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "608f8cab347836163d018031ef6571af4bdf4f5d" }
systemprompt-identifiers = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "608f8cab347836163d018031ef6571af4bdf4f5d" }
systemprompt-models = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "608f8cab347836163d018031ef6571af4bdf4f5d" }
systemprompt-traits = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "608f8cab347836163d018031ef6571af4bdf4f5d" }

# Each of these is the shell manifest's entry, so a test links the versions
# and features the shell does.
gpui-kit = { version = "=0.9.1", features = ["syntect"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tempfile = "3.27"
# Why: core's reqwest is built with rustls-no-provider; the shell binary
# installs ring as the process provider at start (shell/src/app/tls.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "signal"] }

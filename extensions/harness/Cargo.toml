# Desktop shell workspace for the Enterprise Demo template.
#
# Kept as a SEPARATE workspace (the root [workspace] lists it under `exclude`)
# with its own Cargo.lock, so the server image never compiles the window
# toolkit and the desktop build never compiles the server closure. The crates
# under this directory are the only ones in the repository that link the
# window toolkit.
#
# Members, in dependency order: brand, theme, shared, views, shell. `shell`
# builds the `harness` binary. tests/ is a workspace of its own (listed under
# `exclude` here, as the root lists this one): the seven crates that test
# these five through their public API, under the tests lint table. README.md
# says what each holds.
#
# Core is named the way the root manifest names it: git dependencies on one
# rev of systemprompt-core, every entry on one line in the form
# scripts/core-pin.sh rewrites, and tests/Cargo.toml names the same rev. The
# rev is on core's `future` branch, ahead of bridge/CORE_REF: while the two
# differ core-pin.sh checks this workspace against its own rev and moves it
# with `--shell <rev>`; once they are equal it moves with the root.
#
# rustfmt.toml, clippy.toml and deny.toml are the template's: rustfmt, clippy
# and cargo-deny each find them by walking up from this directory. The
# toolchain is this directory's own rust-toolchain.toml.
[workspace]
members = [
    "brand",
    "theme",
    "shared",
    "views",
    "shell",
]
exclude = ["tests"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.70.0"
authors = ["systemprompt.io <ed@systemprompt.io>"]
license = "MIT"
publish = false
repository = "https://github.com/systempromptio/systemprompt-template"
homepage = "https://systemprompt.io"
documentation = "https://systemprompt.io/documentation"

[workspace.dependencies]
systemprompt-harness-brand = { path = "brand" }
systemprompt-harness-theme = { path = "theme" }
systemprompt-harness-shared = { path = "shared" }
systemprompt-harness-views = { path = "views" }
systemprompt-harness-shell = { path = "shell" }

systemprompt-device = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "8bebe1607ff1adbea84ef57a426b8a9519a300fa" }
systemprompt-drive = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "8bebe1607ff1adbea84ef57a426b8a9519a300fa" }
systemprompt-engine = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "8bebe1607ff1adbea84ef57a426b8a9519a300fa" }
systemprompt-harness = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "8bebe1607ff1adbea84ef57a426b8a9519a300fa" }
systemprompt-identifiers = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "8bebe1607ff1adbea84ef57a426b8a9519a300fa" }
systemprompt-models = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "8bebe1607ff1adbea84ef57a426b8a9519a300fa" }
systemprompt-traits = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "8bebe1607ff1adbea84ef57a426b8a9519a300fa" }

# The window toolkit, pinned exactly: a bump is re-checked against every view.
gpui-kit = { version = "=0.9.1", features = ["syntect"] }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7"
embed-resource = "3"
ignore = "0.4"
open = "5"
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "tracing-log"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "v5"] }

# The root workspace's lint table, unchanged. [workspace.lints] is read per
# workspace, so the shell carries its own copy; keep the two identical.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
return_self_not_must_use = "allow"
must_use_candidate = "allow"
trivially_copy_pass_by_ref = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
format_push_string = "allow"
uninlined_format_args = "allow"
result_unit_err = "allow"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
derive_partial_eq_without_eq = "allow"
cognitive_complexity = "allow"
unwrap_or_default = "allow"
redundant_pub_crate = "allow"

too_many_arguments = "deny"
type_complexity = "warn"
too_many_lines = "warn"
inefficient_to_string = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

if_not_else = "warn"
redundant_else = "warn"
manual_let_else = "warn"
match_bool = "warn"
option_if_let_else = "warn"
needless_pass_by_value = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"

or_fun_call = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"
implicit_clone = "warn"
large_futures = "warn"

match_wild_err_arm = "warn"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
exit = "deny"
rc_mutex = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
lossy_float_literal = "deny"
read_zero_byte_vec = "deny"
path_buf_push_overwrite = "deny"
verbose_file_reads = "deny"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"
clone_on_ref_ptr = "warn"
separated_literal_suffix = "warn"
try_err = "warn"

map_err_ignore = "warn"
str_to_string = "warn"
undocumented_unsafe_blocks = "warn"
self_named_module_files = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

# Shipping profile: thin LTO; panic stays "unwind" so tokio turns a panicking
# task into a JoinError and the app survives it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
panic = "unwind"

[package]
name = "systemprompt-web-admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Admin dashboard extension for the systemprompt.io template: governed operations UI over agents, MCP servers, users, and analytics."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
systemprompt-mcp-shared = { workspace = true }
semver = "1"
# Foundation
systemprompt-web-shared = { workspace = true }
# Audit: uses ai, identifiers, models, oauth, security — requires `full`.
systemprompt = { workspace = true, features = ["full"] }
systemprompt-security = { workspace = true }

# Database
sqlx = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Crypto & encoding
sha2 = { workspace = true }
serde_jcs = { workspace = true }
chacha20poly1305 = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

# Templating
handlebars = { workspace = true }

# Archive
tempfile = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# ADFS SAML 2.0 relying party: pure-Rust XML-DSig, no libxml2/xmlsec.
saml = { workspace = true }

# Utilities
url = { workspace = true }
urlencoding = { workspace = true }
inventory = { workspace = true }
async-trait = { workspace = true }

[features]
# The ssr_governance surface lives upstream in systemprompt-template; this fork
# does not ship it. The feature keeps the shared repository files identical
# across both trees while compiling their dead-in-this-fork queries out.
governance-ssr = []

[lints]
workspace = true

[package]
name = "systemprompt-web-site"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Public site extension for the systemprompt.io template: pages, guides, and static-site routes for the self-hosted AI governance binary."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
inventory = { workspace = true }
systemprompt-web-shared = { workspace = true }
systemprompt-web-admin = { workspace = true }
# Audit: uses config (profile paths), database, extension, models, template_provider.
systemprompt = { workspace = true, features = ["database", "config"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

# Registration macros expand to ::inventory::submit! paths; machete
# cannot see through the macro.
[package.metadata.cargo-machete]
ignored = ["inventory"]

[package]
name = "systemprompt-web-extension"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "Web extension for the systemprompt.io template: content, navigation, and template rendering for the self-hosted AI governance binary."
repository.workspace = true
homepage.workspace = true
publish = false

# extension_migrations!() expands to ::systemprompt_extension paths; machete
# cannot see macro-expansion usage.
[package.metadata.cargo-machete]
ignored = ["systemprompt-extension"]

# One feature per capability a flavour selects; each turns on the matching
# console page group and the member contributions that need it.
[features]
gateway = ["systemprompt/ai", "systemprompt-web-admin/gateway"]
mcp = ["systemprompt/mcp-servers", "systemprompt/marketplace", "systemprompt-web-admin/mcp"]
agents = ["mcp", "systemprompt/agents", "systemprompt-web-admin/agents"]
content = [
    "systemprompt/content",
    "dep:systemprompt-web-jobs",
    "systemprompt-web-admin/content",
]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# Audit: the member surface (extension router, api, users), governance
# (security) and config; each capability feature above adds its own.
systemprompt = { workspace = true, features = ["api", "security", "config"] }

# Local sub-crates
systemprompt-web-shared = { workspace = true }
systemprompt-web-admin = { workspace = true }
systemprompt-web-content = { workspace = true }
systemprompt-web-site = { workspace = true }
systemprompt-web-jobs = { workspace = true, optional = true }

# Extension framework — direct dep so the `extension_migrations!()` macro
# expansion (`::systemprompt_extension::Migration`) resolves.
systemprompt-extension = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }

# Utilities
tracing = { workspace = true }

[build-dependencies]
systemprompt-extension = { workspace = true }

[workspace]
members = [
    "extensions/cli/kit-export",
    "extensions/web",
    "extensions/web/shared",
    "extensions/web/admin",
    "extensions/web/content",
    "extensions/web/site",
    "extensions/web/jobs",
    "extensions/mcp/systemprompt",
    "extensions/mcp/shared",
]
# The test workspace under tests/ is a separate workspace so it never compiles
# when these extension crates are consumed as dependencies. Run it explicitly:
#   cargo test --manifest-path tests/Cargo.toml
exclude = ["tests", "extensions/harness", "extensions/mobile/core"]
resolver = "2"

[profile.dev]
opt-level = 0
split-debuginfo = "packed"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.70.0"
authors = ["systemprompt.io <ed@systemprompt.io>"]
license = "MIT"
repository = "https://github.com/systempromptio/systemprompt-template"
homepage = "https://systemprompt.io"
documentation = "https://systemprompt.io/documentation"

[workspace.dependencies]
# ============================================
# CORE FACADE (single dependency for all systemprompt-core)
# ============================================
systemprompt = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "0b45e83d2b7ebb8bbcf06ae19cf0bc65d3f647d4", default-features = false, features = ["core"] }
systemprompt-extension = { version = "0.87.0", git = "https://github.com/systempromptio/systemprompt-core", rev = "0b45e83d2b7ebb8bbcf06ae19cf0bc65d3f647d4" }

# ============================================
# LOCAL EXTENSIONS
# ============================================
systemprompt-web-extension = { path = "extensions/web" }
systemprompt-web-shared = { path = "extensions/web/shared" }
systemprompt-web-admin = { path = "extensions/web/admin" }
systemprompt-web-content = { path = "extensions/web/content" }
systemprompt-web-site = { path = "extensions/web/site" }
systemprompt-web-jobs = { path = "extensions/web/jobs" }
systemprompt-mcp-shared = { path = "extensions/mcp/shared" }
serde_jcs = "0.1"

# Core runtime dependencies
tokio = { version = "1.49", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "process", "signal"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
async-trait = "0.1"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "macros", "postgres", "migrate", "chrono", "rust_decimal", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
thiserror = "2.0"
shell-words = "1.1"

# HTTP/API
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "normalize-path"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

# Utilities
chacha20poly1305 = "0.10"
schemars = { version = "1.0", features = ["derive"] }
walkdir = "2.0"
tempfile = "3.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
url = "2.5"
cookie = { version = "0.18", default-features = false }
urlencoding = "2.1"
# RS256 signing of the per-user identity token for external MCP servers,
# with core's authority key — so the version must be core's.
saml = { version = "0.0.1-alpha.2", default-features = false, features = ["rsa-sha", "xmlenc"] }

# Security
rand = "0.9"
sha2 = "0.10"
flate2 = "1.1"
futures-util = "0.3"
hex = "0.4"
base64 = "0.22"

handlebars = "6"




# MCP Protocol
rmcp = { version = "=3.9.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "macros", "auth"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
return_self_not_must_use = "allow"
must_use_candidate = "allow"
trivially_copy_pass_by_ref = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
format_push_string = "allow"
uninlined_format_args = "allow"
result_unit_err = "allow"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
derive_partial_eq_without_eq = "allow"
cognitive_complexity = "allow"
unwrap_or_default = "allow"
redundant_pub_crate = "allow"

too_many_arguments = "deny"
type_complexity = "warn"
too_many_lines = "warn"
inefficient_to_string = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

if_not_else = "warn"
redundant_else = "warn"
manual_let_else = "warn"
match_bool = "warn"
option_if_let_else = "warn"
needless_pass_by_value = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"

or_fun_call = "warn"
redundant_clone = "warn"
unnecessary_to_owned = "warn"
implicit_clone = "warn"
large_futures = "warn"

match_wild_err_arm = "warn"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
exit = "deny"
rc_mutex = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
lossy_float_literal = "deny"
read_zero_byte_vec = "deny"
path_buf_push_overwrite = "deny"
verbose_file_reads = "deny"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"
clone_on_ref_ptr = "warn"
separated_literal_suffix = "warn"
try_err = "warn"

map_err_ignore = "warn"
str_to_string = "warn"
undocumented_unsafe_blocks = "warn"
self_named_module_files = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

# ============================================
# ROOT PACKAGE (Template Application)
# ============================================
[package]
name = "systemprompt-template"
version.workspace = true
edition.workspace = true
description = "AI Governance Infrastructure — local evaluation. The governance layer for AI agents: a single compiled Rust binary that authenticates, authorises, rate-limits, logs, and costs every AI interaction. Self-hosted, air-gap capable, provider-agnostic. Built on systemprompt-core."
license = "MIT"
readme = "README.md"
repository = "https://github.com/systempromptio/systemprompt-template"
homepage = "https://systemprompt.io"
documentation = "https://systemprompt.io/documentation/"
keywords = ["ai", "governance", "mcp", "agents", "claude"]
categories = ["command-line-utilities", "web-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "systemprompt"
path = "src/main.rs"

[dependencies]
# Core framework (facade)
systemprompt = { workspace = true }

# Local extensions
systemprompt-web-extension = { workspace = true }
systemprompt-mcp-agent = { path = "extensions/mcp/systemprompt", optional = true }

# A build names one flavour:
#   cargo build --no-default-features --features flavour-<name>
# flavours/<name>/flavour.yaml describes each one; scripts/check-flavours.sh
# keeps the two in step. Each larger flavour includes the one below it, and
# full is the union of all four plus Slack and every remaining core capability.
[features]
flavour-gateway = [
    "systemprompt/runtime",
    "systemprompt/identity",
    "systemprompt/analytics",
    "systemprompt/ai",
    "systemprompt/cloud",
    "systemprompt/otel",
    "systemprompt/bridge",
    "systemprompt-web-extension/gateway",
]
flavour-mcp = [
    "flavour-gateway",
    "systemprompt/mcp-servers",
    "systemprompt/marketplace",
    "systemprompt-web-extension/mcp",
    "dep:systemprompt-mcp-agent",
]
flavour-agents = [
    "flavour-mcp",
    "systemprompt/agents",
    "systemprompt/agent-runs",
    "systemprompt/notifications",
    "systemprompt/brain",
    "systemprompt-web-extension/agents",
]
flavour-site = [
    "systemprompt/runtime",
    "systemprompt/identity",
    "systemprompt/analytics",
    "systemprompt/content",
    "systemprompt/files",
    "systemprompt/files-pdf",
    "systemprompt-web-extension/content",
]
flavour-full = [
    "flavour-agents",
    "flavour-site",
    "systemprompt/reference",
    "systemprompt/slack",
]

[lints]
workspace = true

name: Core checkout
description: >-
  Check out systempromptio/systemprompt-core at bridge/CORE_REF inside the
  workspace and link it as the ../systemprompt-core sibling core's contract
  scanners (check-fail-open, check-discarded-results) run from. The build
  itself resolves core from the git-rev pin, not from this checkout.
runs:
  using: composite
  steps:
    - name: Read pinned core ref
      id: core
      shell: bash
      run: |
        set -euo pipefail
        test -f bridge/CORE_REF
        ref=$(tr -d '[:space:]' < bridge/CORE_REF)
        test -n "$ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: systempromptio/systemprompt-core
        ref: ${{ steps.core.outputs.ref }}
        path: .vendor/systemprompt-core
    - name: Link the sibling path the scanners read
      shell: bash
      run: |
        ln -sfn "$GITHUB_WORKSPACE/.vendor/systemprompt-core" "$GITHUB_WORKSPACE/../systemprompt-core"
        echo "core ${{ steps.core.outputs.ref }} at .vendor/systemprompt-core (sibling link in place)"

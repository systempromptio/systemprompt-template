name: Flavours

# Every flavour in flavours/index.yaml: the flavour lint, then per flavour the
# query gate (scripts/check-flavour-queries.sh: every compile-checked query
# against a database that flavour migrated), a clean and a cached image build
# with deploy metrics (scripts/flavour-metrics.sh --image) and the image smoke
# (scripts/flavour-smoke.sh). Metrics JSON and the
# smoke results are uploaded; table.md is appended to the job summary. A
# desktop or mobile flavour (artefact: desktop, mobile) is linted here and
# built by its own workflow, never by this matrix. Core resolves from the git-rev pin in
# Cargo.toml (scripts/core-pin.sh), so no core checkout is needed.

on:
  push:
    branches: [next, future]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flavours-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Flavour lint and matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flavours: ${{ steps.plan.outputs.flavours }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-flavours.sh
      - run: bash scripts/core-pin.sh --check
      - id: plan
        run: echo "flavours=$(python3 scripts/flavour.py matrix --artefact image)" >> "$GITHUB_OUTPUT"

  queries:
    name: Queries ${{ matrix.flavour }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.flavours) }}
    env:
      FLAVOUR_QUERIES_ADMIN_URL: postgres://queries:queries@localhost:5432/queries
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: queries
          POSTGRES_PASSWORD: queries
          POSTGRES_DB: queries
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queries -d queries"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/reclaim-disk
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config postgresql-client python3 python3-yaml
        timeout-minutes: 5
      - run: rustup show
        timeout-minutes: 5
      - run: bash scripts/check-flavour-queries.sh "${{ matrix.flavour }}"
        timeout-minutes: 80

  flavour:
    name: ${{ matrix.flavour }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.flavours) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/reclaim-disk
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker
      - name: Image build and deploy metrics
        run: bash scripts/flavour-metrics.sh "${{ matrix.flavour }}" --image --bench
      - name: Image smoke
        run: bash scripts/flavour-smoke.sh "${{ matrix.flavour }}" --no-build
      - if: always()
        run: |
          if [ -f target/flavour-metrics/table.md ]; then
            { echo "## Flavour ${{ matrix.flavour }}"; cat target/flavour-metrics/table.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flavour-${{ matrix.flavour }}
          path: |
            target/flavour-metrics/
            target/flavour-smoke/
          retention-days: 30

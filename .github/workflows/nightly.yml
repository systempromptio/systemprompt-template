# Nightly gate: apply the mechanical coding-standards fixes to `next`, run the
# full pre-release cycle against it, and move `main` only if every gate is green.
#
# `next` is the feeder branch — every agent and every local session commits and
# pushes there without running a gate. `main` is protected and release-only: it
# moves only through the promote job below, so its tip is always a commit that
# passed the whole cycle.
#
# The heavy gates live in the workflows called below and are handed an explicit
# `ref`. `next` is the repository's default branch, which is what a `schedule:`
# trigger fires from, so both the gate definitions and the code under test come
# from `next` — a change to these workflows takes effect on the next run.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      autofix:
        description: "Commit mechanical fixes (fmt, clippy --fix) back to next"
        type: boolean
        default: true
      promote:
        description: "Move main to the gated commit when every gate is green"
        type: boolean
        default: true

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  autofix:
    name: Auto-fix coding standards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config

      - name: rustfmt
        if: inputs.autofix != false
        run: |
          cargo fmt --all
          cargo fmt --manifest-path tests/Cargo.toml --all

      # clippy --fix applies only machine-applicable suggestions. If it rewrites
      # something into a broken state the gate jobs below catch it and `main` is
      # not promoted, so this is safe to run unattended.
      - name: clippy --fix (machine-applicable only)
        if: inputs.autofix != false
        continue-on-error: true
        run: |
          cargo clippy --fix --allow-dirty --allow-staged \
            --workspace --all-targets || true

      - name: rustfmt again (clippy --fix reflows code)
        if: inputs.autofix != false
        run: |
          cargo fmt --all
          cargo fmt --manifest-path tests/Cargo.toml --all

      - name: Commit and push to next
        id: result
        run: |
          set -euo pipefail
          git config user.name  "systemprompt-nightly[bot]"
          git config user.email "nightly@systemprompt.io"
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git add -A
            git commit \
              -m "style: apply the nightly mechanical coding-standards fixes" \
              -m "rustfmt plus clippy's machine-applicable suggestions. No judgement calls are made here."
            git push origin HEAD:next
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no mechanical fixes needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    name: Gate
    needs: autofix
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}

  quality:
    name: Gate
    needs: autofix
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}

  promote:
    name: Promote next to main
    needs: [autofix, ci, quality]
    if: ${{ inputs.promote != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # `main` requires a pull request and grants no bypass to anyone — that is
      # what stops every human and agent pushing to it directly, admins
      # included. A merge is therefore the only way in, including for this job.
      - name: Open or reuse the promotion PR, then merge it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.autofix.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin next main
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "main already contains $SHA — nothing to promote."
            exit 0
          fi
          # Promote a FROZEN ref, never `next` itself. A PR whose head is
          # `next` merges whatever `next` points at *when the merge runs*, so a
          # push landing during the ~40min gate would ride into `main` ungated.
          # (That happened on the first live run.) `promote` is force-updated to
          # the exact commit the gates passed, and that is what gets merged.
          git push --force origin "$SHA:refs/heads/promote"

          # `gh pr create` has no --json flag: it prints the URL. Ask for the
          # number separately rather than trying to capture it from the create.
          NUM=$(gh pr list --base main --head promote --state open \
                  --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh pr create --base main --head promote \
              --title "Promote next to main" \
              --body "Opened by the Nightly workflow after every gate passed against \`$SHA\`."
            NUM=$(gh pr list --base main --head promote --state open \
                    --json number --jq '.[0].number // empty')
          fi
          if [ -z "$NUM" ]; then
            echo "::error::could not open or find a promote -> main pull request"
            exit 1
          fi
          echo "merging PR #$NUM (frozen at $SHA)"
          # No --admin: the ruleset requires 0 approvals, so an ordinary merge
          # satisfies it. --admin would need admin rights GITHUB_TOKEN lacks.
          gh pr merge "$NUM" --merge
          echo "promoted $SHA to main via PR #$NUM"

      - name: Summary
        run: |
          {
            echo "### Nightly promoted \`next\` → \`main\`"
            echo
            echo "- commit: \`${{ needs.autofix.outputs.sha }}\`"
            echo "- mechanical fixes committed: \`${{ needs.autofix.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report a held-back main
    needs: [autofix, ci, quality]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          {
            echo "### Nightly gate failed — \`main\` was NOT promoted"
            echo
            echo "\`next\` is at \`${{ needs.autofix.outputs.sha }}\`."
            echo "Mechanical fixes were applied where possible; what remains needs a person."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

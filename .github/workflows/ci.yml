name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  pull_request:
    branches: [main, next]
  # Work lands on `next` by push, not through a pull request, so a PR-only
  # trigger meant every commit that went straight to `next` was ungated. On
  # 2026-08-29 three such commits sat there with no CI at all. The dispatch
  # input above still exists for gating an explicit SHA at release time.
  push:
    branches: [next]

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SQLX_OFFLINE: "true"
  # aws-lc-sys refuses to build with GCC <10 (bug #95189) and the release
  # profile's LTO trips it; ubuntu-latest ships clang, so force it everywhere
  # this repo compiles C. Mirrors the CC/CXX toggle in the justfile build recipe.
  CC: clang
  CXX: clang++

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      # rust-toolchain.toml pins the nightly channel and its components
      # (rustfmt, clippy, llvm-tools). `rustup show` installs exactly that
      # toolchain, so fmt runs on the same version developers use locally with
      # no channel duplicated in this file.
      - run: rustup show
      - run: cargo fmt --all -- --check
      # tests/ is excluded from the root workspace, so --all does not reach it.
      - run: cargo fmt --manifest-path tests/Cargo.toml --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  sqlx-check:
    name: SQLx Offline Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Every extension crate that invokes a sqlx query macro must ship a
      # committed .sqlx/ cache so the -D warnings offline build above is
      # reproducible. Find crates whose sources use a query!-family macro but
      # lack a sibling .sqlx directory and fail loudly, naming them.
      - name: Verify release version pins
        run: bash scripts/sync-release-version.sh "$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)" --check
      - name: Verify offline sqlx cache is current
        run: bash scripts/check-sqlx-cache.sh
      - run: cargo check --workspace --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    # The integration crate gives every test its own throwaway database, so the
    # suite is dominated by CREATE/DROP DATABASE round-trips, not CPU: ~830
    # tests take ~23 minutes on a runner, before the ~4 minutes of cold compile.
    # 30 minutes cancelled the job mid-run once the suite grew; 60 leaves room
    # for it to keep growing without a red X that means nothing about the code.
    timeout-minutes: 60
    # The test workspace verifies behaviour; linting it is quality.yml's job,
    # so it does not inherit the -D warnings RUSTFLAGS.
    env:
      RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check for tests workspace
        id: tests
        run: |
          if [ -f tests/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/Cargo.toml not present yet; skipping test job."
          fi

      - run: rustup show
        if: steps.tests.outputs.present == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.tests.outputs.present == 'true'
        with:
          workspaces: |
            .
            tests

      # nextest is what `just test-*` runs, so CI matches it. It is no longer
      # load-bearing for correctness: the tests that used to depend on
      # process-per-test isolation now take their CLI location, blog config and
      # prune flag as arguments rather than reading process-global state.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # No profile bootstrap or migrate step: the integration crate is a
      # self-contained throwaway-database harness. It connects to the server's
      # `postgres` maintenance DB (the superuser the postgres:16 image creates),
      # CREATE DATABASEs a per-test schema, applies the minimal tables it needs,
      # and drops them on teardown. All it requires is DATABASE_URL pointing at a
      # reachable Postgres. Unit crates need no DB at all. The contract crate
      # follows the same convention but links systemprompt-web-admin, whose
      # sqlx::query! macros need the offline cache — tests/.sqlx symlinks the
      # root one, since `[patch]` and cache lookup are both workspace-scoped.
      - name: Run tests (unit, integration, and the admin HTTP contract)
        if: steps.tests.outputs.present == 'true'
        env:
          SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
        run: cargo nextest run --locked --manifest-path tests/Cargo.toml --workspace

      - name: Run admin unit tests
        if: steps.tests.outputs.present == 'true'
        env:
          SQLX_OFFLINE: "true"
        run: cargo nextest run --locked -p systemprompt-web-admin --tests

      # Asset manifests, CSS reachability, and frontend standards live in
      # web-unit-tests and run in the tests workspace above.

  e2e:
    name: E2E (Playwright, admin console)
    needs: test
    runs-on: ubuntu-latest
    # A debug build of the server, a seeded database and a browser walk of every
    # admin page. Slower than `test`, and it needs the stack alive, so it is its
    # own job rather than a step appended to one.
    timeout-minutes: 60
    env:
      RUSTFLAGS: ""
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      GATEWAY_URL: http://localhost:8080
    steps:
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/lib/google-cloud-sdk \
            /opt/microsoft /opt/az /usr/share/az_* \
            /usr/local/graalvm /usr/share/kotlinc \
            /usr/local/share/boost /usr/local/julia* \
            /opt/pipx /usr/local/aws-cli /usr/local/lib/heroku \
            "${AGENT_TOOLSDIRECTORY:-}" 2>/dev/null || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: extractions/setup-just@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config python3 postgresql-client
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: just build
      # setup-local brings up its own Docker Postgres, so this job takes no
      # `services:` block: the seed then reads the same profile secrets a
      # developer's machine does, and CI and local disagree about nothing.
      #
      # The key is a placeholder and is never used: no page spec exercises
      # inference, and setup-local simply refuses to generate a profile with no
      # provider key at all off a TTY.
      - name: Provision the local profile
        run: just setup-local "sk-ant-e2e-placeholder" "" "" 8080 5432 e2e@example.invalid
      # `infra services start` holds the terminal for the life of the server, so
      # it must be detached here or the job spends its whole timeout on this
      # step and never reaches the health wait.
      - name: Start the stack (detached)
        run: nohup just start > e2e-server.log 2>&1 &
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8080/health && exit 0
            sleep 2
          done
          echo "server never became healthy"; exit 1
      - run: just e2e-install
      - run: just e2e --project chromium
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-server-log
          path: e2e-server.log

name: Quality

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  pull_request:
    branches: [main, next]
  # Work lands on `next` by push, not through a pull request, so a PR-only
  # trigger meant every commit that went straight to `next` was ungated. On
  # 2026-08-29 three such commits sat there with no CI at all. The dispatch
  # input above still exists for gating an explicit SHA at release time.
  push:
    branches: [next]

concurrency:
  group: quality-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # aws-lc-sys needs clang (GCC <10 bug #95189); ubuntu-latest ships it.
  CC: clang
  CXX: clang++

jobs:
  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace builds against the sibling core checkout via
      # [patch.crates-io] on `next`, and bridge/ depends on systemprompt-bridge
      # by path. Materialise the sibling at the ref bridge/CORE_REF pins: the
      # checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      # Clippy runs on the pinned nightly (channel + clippy component) declared
      # in rust-toolchain.toml, which `rustup show` installs — so lint results
      # match local `just clippy` with no channel duplicated here.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Rustdoc (warnings as errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace builds against the sibling core checkout via
      # [patch.crates-io] on `next`, and bridge/ depends on systemprompt-bridge
      # by path. Materialise the sibling at the ref bridge/CORE_REF pins: the
      # checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  source-gates:
    name: Schema / SQL / error-boundary linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # The five structural gate scripts ported from systemprompt-core, plus the
      # inlined no-synthesis guard (kept inline so this job does not depend on
      # `just` being installed).
      - run: bash scripts/lint-schema.sh
      - run: bash scripts/lint-extensions.sh
      - run: bash scripts/check-sqlx.sh
      - run: bash scripts/check-http-errors.sh
      - run: bash scripts/check-test-value.sh
      - run: bash scripts/lint-raw-ids.sh
      - run: bash scripts/check-glob-reexports.sh
      - name: No archaeology, caller-reference, or paraphrase comments
        run: bash scripts/check-comments.sh
      - name: Inline comments limited to Why/JSON justifications
        run: bash scripts/lint-inline-comments.sh
      # Downstream forks share these files but not their callers; a symbol is
      # only reported when it is dead here AND in the fork.
      - name: No dead repository code
        run: bash scripts/check-dead-repository-code.sh
      - name: Admin templates reference published assets
        run: bash scripts/check-admin-template-assets.sh
      - name: Admin template links match registered routes
        run: bash scripts/check-admin-template-links.sh
      # admin-css-classes + frontend-standards run as cargo tests in
      # extensions/web/tests/ (admin_css_classes.rs, frontend_standards.rs).
      - name: Every production source has a `//!` module head
        run: bash scripts/check-file-headers.sh
      - name: No synthesized principals (UserId::new with string literal)
        run: |
          hits=$(grep -rEn 'UserId::new\("' extensions/ \
              --include='*.rs' \
              --exclude-dir=tests \
              --exclude-dir=bootstrap \
              || true)
          if [ -n "$hits" ]; then
            echo "error: forbidden synthesized principal — UserId::new with string literal"
            echo "$hits"
            echo
            echo "UserId::new must take a validated identifier (cookie, query, JWT"
            echo "claim, or DB row), never a hard-coded literal. Legitimate bootstrap"
            echo "code belongs under extensions/**/bootstrap/."
            exit 1
          fi

  file-size:
    name: Source file size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # No extension source file (excluding tests) may exceed 300 lines. Same
      # script as `just file-size`.
      - name: Enforce 300-line ceiling on extension sources
        run: bash scripts/check-file-size.sh

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace builds against the sibling core checkout via
      # [patch.crates-io] on `next`, and bridge/ depends on systemprompt-bridge
      # by path. Materialise the sibling at the ref bridge/CORE_REF pins: the
      # checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # The MSRV is read from the manifest, never named here — a number in this
      # file stops matching the day someone edits `rust-version`. The job also
      # used to install a toolchain and then run a bare `cargo check`, which
      # silently ran the nightly from `rust-toolchain.toml`: it passed while
      # testing nothing. `scripts/check-msrv.sh` sets RUSTUP_TOOLCHAIN, which is
      # what actually outranks a toolchain file, and asserts the running cargo
      # before it checks anything.
      - run: bash scripts/check-msrv.sh

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace builds against the sibling core checkout via
      # [patch.crates-io] on `next`, and bridge/ depends on systemprompt-bridge
      # by path. Materialise the sibling at the ref bridge/CORE_REF pins: the
      # checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  machete:
    name: Unused dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

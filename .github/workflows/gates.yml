name: Gates

# The whole gate, on every push to `next`, every ordinary PR and on demand —
# `just verify` locally runs the same static, lint and test tiers. Frozen
# promotion PRs (promote/<version>/<main>/<candidate>, opened by
# `just release`) do not repeat the matrix: they verify the exact next-push
# proof, the base, the head and the merge tree. See docs/BRANCHING.md.
#
# Replaces ci.yml + quality.yml. Every tier runs independently (no `needs`
# between them), so one red tier never hides another; "Gates passed" is the
# single context the `main` ruleset should require.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  pull_request:
    branches: [main, next]
  push:
    branches: [next]

concurrency:
  group: gates-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # aws-lc-sys refuses to build with GCC <10 and the release profile's LTO
  # trips it; mirror the justfile's CC/CXX toggle.
  CC: clang
  CXX: clang++
  # scripts/build-coordinator.sh serialises builds across agents sharing one
  # clone (and guards free disk); a runner is single-tenant, so bypass it.
  BUILD_NO_COORD: "1"
  # Tool pins: one place to bump, by hand, like the SHA-pinned actions.
  JUST_VERSION: "1.42.4"
  NEXTEST_VERSION: "0.9.148"
  DENY_VERSION: "0.20.2"
  MACHETE_VERSION: "0.9.2"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  promotion:
    name: Verify frozen promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'promote/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            let pr;
            for (let attempt = 0; attempt < 6; attempt++) {
              pr = (await github.rest.pulls.get({owner, repo, pull_number: context.payload.pull_request.number})).data;
              if (pr.mergeable !== null) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const match = /^promote\/(\d+\.\d+\.\d+)\/([0-9a-f]{40})\/([0-9a-f]{40})$/.exec(pr.head.ref);
            if (!match || pr.head.repo.full_name !== context.payload.repository.full_name || pr.base.ref !== 'main' || pr.base.sha !== match[2] || pr.head.sha !== match[3]) {
              throw new Error('Promotion identity differs from frozen head/base');
            }
            const currentMain = (await github.rest.git.getRef({owner, repo, ref: 'heads/main'})).data.object.sha;
            const currentNext = (await github.rest.git.getRef({owner, repo, ref: 'heads/next'})).data.object.sha;
            if (currentMain !== pr.base.sha || currentNext !== pr.head.sha) throw new Error('main or next moved');
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `${pr.base.sha}...${pr.head.sha}`})).data;
            if (comparison.status !== 'ahead' || comparison.behind_by !== 0) throw new Error('main is not an ancestor of candidate');
            const runs = (await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'gates.yml', event: 'push', branch: 'next', head_sha: pr.head.sha, per_page: 1})).data.workflow_runs;
            const run = runs[0];
            if (!run || run.head_sha !== pr.head.sha || run.head_branch !== 'next' || run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Latest exact next-push Gates run did not succeed');
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100});
            const proof = jobs.filter(job => job.name === 'Gates passed');
            if (proof.length !== 1 || proof[0].status !== 'completed' || proof[0].conclusion !== 'success') throw new Error('Gates passed aggregate did not succeed');
            const head = (await github.rest.git.getCommit({owner, repo, commit_sha: pr.head.sha})).data;
            if (pr.mergeable !== true || !pr.merge_commit_sha) throw new Error('GitHub merge result is not ready or conflicts');
            const merge = (await github.rest.git.getCommit({owner, repo, commit_sha: pr.merge_commit_sha})).data;
            if (merge.tree.sha !== head.tree.sha || merge.parents.length !== 2 || merge.parents[0].sha !== pr.base.sha || merge.parents[1].sha !== pr.head.sha) throw new Error('Merge result differs from proven candidate');
            const latest = (await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'gates.yml', event: 'push', branch: 'next', head_sha: pr.head.sha, per_page: 1})).data.workflow_runs[0];
            if (!latest || latest.id !== run.id || latest.run_attempt !== run.run_attempt || latest.status !== 'completed' || latest.conclusion !== 'success') throw new Error('Push proof changed during verification');
            core.info(`Verified next-push run ${run.id} attempt ${run.run_attempt}, candidate ${pr.head.sha}, base ${pr.base.sha}`);

  static:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Static (fmt, pins, release self-tests, deploy config, source gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The sibling core is load-bearing here: check-fail-open and
      # check-discarded-results run core's rust-contracts over this tree, and
      # fail in CI without it.
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep jq python3 python3-yaml
        timeout-minutes: 5
      - run: rustup show
        timeout-minutes: 5
      - run: just preflight-static
        timeout-minutes: 12

  lint:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Lint (clippy, rustdoc, MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Why: clippy, rustdoc and the MSRV check each build a dependency tree;
      # together they overflow the runner's ~14 GB.
      - uses: ./.github/actions/reclaim-disk
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep jq python3 python3-yaml clang mold libpq-dev libssl-dev pkg-config
        timeout-minutes: 5
      - run: rustup show
        timeout-minutes: 5
      - run: rustup toolchain install 1.96.0 --profile minimal
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lint
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: just preflight-lint
        timeout-minutes: 50

  test:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Test (unit, integration)
    runs-on: ubuntu-latest
    # Integration is dominated by CREATE/DROP DATABASE round-trips, and a cold
    # cache (every core bump) adds the full compile on top; leave headroom so
    # a growing suite never turns into a meaningless red X.
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The harness accepts a maintenance DB named test, postgres, or *_test.
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/reclaim-disk
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config python3 python3-yaml
        timeout-minutes: 5
      - run: rustup show
        timeout-minutes: 5
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            .
            tests
      - run: just test
        timeout-minutes: 80

  e2e:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: E2E (Playwright, admin console)
    runs-on: ubuntu-latest
    # A debug build of the server, a seeded database and a browser walk of every
    # admin page. It needs the stack alive, so it is its own tier; it does not
    # wait for `test`, so a red unit test cannot hide a broken page.
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      GATEWAY_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/reclaim-disk
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config python3 postgresql-client jq
        timeout-minutes: 5
      - uses: ./.github/actions/core-checkout
      - run: rustup show
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      # The stack needs only the server and the MCP agent it spawns
      # (services/mcp/systemprompt.yaml). This tier used to run `just build`
      # (the whole debug workspace) and then setup-local's full-workspace
      # release build on top; setup-local is now told not to build (last arg).
      - name: Build the server and MCP agent
        timeout-minutes: 45
        run: |
          bash scripts/check-core-ref.sh
          cargo build --locked --workspace --bin systemprompt --bin systemprompt-mcp-agent
      # setup-local brings up its own Docker Postgres, so this job takes no
      # `services:` block: the seed then reads the same profile secrets a
      # developer's machine does. The key is a placeholder and is never used —
      # no page spec exercises inference, and setup-local refuses to generate
      # a profile with no provider key at all off a TTY.
      - name: Provision the local profile
        timeout-minutes: 10
        run: just setup-local "sk-ant-e2e-placeholder" "" "" 8080 5432 e2e@example.invalid false
      # `infra services start` holds the terminal for the life of the server.
      - name: Start the stack (detached)
        run: nohup just start > e2e-server.log 2>&1 &
      - name: Wait for gateway health and signing keys
        timeout-minutes: 5
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health | jq -e '.status == "healthy"' > /dev/null &&
               curl -fsS http://localhost:8080/.well-known/jwks.json | jq -e '.keys | length > 0' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "server never became healthy"; exit 1
      - run: just e2e-install
        timeout-minutes: 10
      - run: just e2e --project chromium
        timeout-minutes: 25
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-server-log
          path: e2e-server.log

  # Supply chain over BOTH workspaces (tests/ is excluded from the root and
  # carries its own lockfile). cargo-deny's advisories check covers what the
  # separate cargo-audit job reported, so there is one advisory source.
  supply-chain:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Supply chain (cargo-deny, cargo-machete)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Native invocation keeps the pinned sibling core visible to metadata;
      # container actions mount only this workspace, not its sibling link.
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@${{ env.DENY_VERSION }},cargo-machete@${{ env.MACHETE_VERSION }}
      # Why the retry: the advisory database is a git fetch from GitHub, and a
      # transient network error there is not a finding. Only the fetch is
      # retried; the check itself runs once, offline, against what was fetched.
      - name: Fetch the advisory database
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            cargo deny fetch && exit 0
            echo "::warning::advisory fetch failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - name: cargo deny (every workspace)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for w in . tests; do
            echo "==> cargo deny: $w"
            cargo deny --offline --manifest-path "$w/Cargo.toml" check
          done
      - run: just machete
        timeout-minutes: 5

  # One stable context for the `main` ruleset: it fails unless every gate
  # above succeeded, so a skipped or cancelled job can never pass as "not
  # failed". Branch protection names this job, never the tiers.
  gates-passed:
    name: Gates passed
    runs-on: ubuntu-latest
    needs: [promotion, static, lint, test, e2e, supply-chain]
    timeout-minutes: 5
    if: always()
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_PROMOTION: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'promote/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          tiers='["static","lint","test","e2e","supply-chain"]'
          if [ "$IS_PROMOTION" = true ]; then
            jq -e --argjson t "$tiers" '.promotion.result == "success" and ([.[$t[]].result] | all(. == "skipped"))' <<<"$NEEDS_JSON" >/dev/null
          else
            jq -e --argjson t "$tiers" '.promotion.result == "skipped" and ([.[$t[]].result] | all(. == "success"))' <<<"$NEEDS_JSON" >/dev/null
          fi

# ConfigMap holding the systemprompt profile YAML.
#
# There is ONE profile because there is one kind of pod. Every replica runs the
# whole product — API, MCP servers, marketplace and the scheduler — and scheduled
# jobs are de-duplicated across pods by a Postgres advisory lock, not by giving
# one pod a different config.
#
# This is a PLACEHOLDER. In a real cluster, generate it from
# `.systemprompt/profiles/scaled/profile.yaml`, e.g.:
#   kubectl create configmap systemprompt-profiles \
#     --from-file=profile-scaled.yaml=.systemprompt/profiles/scaled/profile.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: systemprompt-profiles
  labels:
    app.kubernetes.io/name: systemprompt
    app.kubernetes.io/part-of: scaled-stack
data:
  # PLACEHOLDER — replace with the real scaled profile contents.
  profile-scaled.yaml: |
    name: scaled
    display_name: Scaled
    # ... full profile body supplied at deploy time ...

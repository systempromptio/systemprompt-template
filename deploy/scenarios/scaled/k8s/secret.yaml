# Generate one profile with core 0.47 setup, configure its /app paths and database
# URL, then share its identity across every replica. Never generate per-pod keys.
# kubectl create secret generic systemprompt-profile-secrets \
#   --from-file=secrets.json=.systemprompt/profiles/scaled/secrets.json
# The Secret below is a placeholder; replace it before applying this example.
apiVersion: v1
kind: Secret
metadata:
  name: systemprompt-profile-secrets
  labels:
    app.kubernetes.io/name: systemprompt
    app.kubernetes.io/part-of: scaled-stack
type: Opaque
stringData:
  secrets.json: REPLACE_WITH_GENERATED_SECRETS_JSON

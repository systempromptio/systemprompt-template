# Keep the latest release's run record current. Copied verbatim into a kit
# repository beside publish-bundle.yml; needs SYSTEMPROMPT_API_URL and
# KIT_STATS_PAT (a PAT whose owner has console access) and does nothing
# but warn without them. Only the notes and the kit-stats.json asset of the
# latest release change; no commit is made.
name: Kit stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to refresh (default: the latest)"
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.SYSTEMPROMPT_API_URL }}
      STATS_PAT: ${{ secrets.KIT_STATS_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the run record
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag=$(gh release view --json tagName -q .tagName)
          tools/kit-stats.sh "$tag"

[package]
name = "template-test-common"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
systemprompt-users = { workspace = true }
systemprompt-content = { workspace = true }
systemprompt-marketplace = { workspace = true }
# Why: the throwaway database is built by the same `install_extension_schemas`
# path the server runs at boot, and that path only sees migrations from crates
# actually linked into the test binary. Linking them here is what makes one
# harness usable by every suite.
systemprompt = { workspace = true, features = ["full"] }
systemprompt-web-admin = { workspace = true }
systemprompt-web-content = { workspace = true }
systemprompt-web-extension = { workspace = true }

sqlx = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

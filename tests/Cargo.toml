# Test workspace for the Enterprise Demo template.
#
# Kept as a SEPARATE workspace (the root [workspace] lists it under `exclude`)
# so these test crates never compile when the extension crates are consumed as
# dependencies, mirroring systemprompt-core's crates/tests layout.
#
# Run:  cargo test --manifest-path tests/Cargo.toml
# Needs a live Postgres for the integration crate — set DATABASE_URL (the
# root justfile's local profile URL works).
[workspace]
members = [
    "common",
    "unit/mcp",
    "unit/web",
    "integration/admin-config",
    "integration/mcp",
    "integration/web",
    "integration/admin-core",
    "integration/schema-upgrade",
    "integration/gateway",
    "contract/admin",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

# Test code asserts by panicking and constructs fixtures liberally; relax the
# strict production lints the root workspace enforces. This is an intentional
# partial mirror of the root Cargo.toml [workspace.lints.clippy] block: only
# the relaxations below differ.
[workspace.lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
template-test-common = { path = "common" }
# Local extension crates under test (paths relative to tests/).
systemprompt-mcp-shared = { path = "../extensions/mcp/shared" }
systemprompt-mcp-agent = { path = "../extensions/mcp/systemprompt" }
systemprompt-web-shared = { path = "../extensions/web/shared" }
systemprompt-web-admin = { path = "../extensions/web/admin" }
systemprompt-web-content = { path = "../extensions/web/content" }
systemprompt-web-jobs = { path = "../extensions/web/jobs" }
systemprompt-web-extension = { path = "../extensions/web" }
systemprompt-web-site = { path = "../extensions/web/site" }
systemprompt-kit-export = { path = "../extensions/cli/kit-export" }

# Core facade — DbPool / Database / identifiers for the integration crate.
# The contract crate additionally enables `full`, which links the core
# extension crates whose `register_extension!` registrations carry the
# migrations the admin schema needs.
systemprompt = { version = "0.87.0", default-features = false, features = ["core", "database"] }
systemprompt-security = { version = "0.87.0" }
systemprompt-users = { version = "0.87.0" }
systemprompt-content = { version = "0.87.0" }
systemprompt-marketplace = { version = "0.87.0" }
systemprompt-api = { version = "0.87.0" }

# HTTP contract harness — drives the real admin router in-process.
axum = "0.8"
handlebars = "6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
# Alias serde_yaml_ng exactly as the root workspace does: core's APIs expose
# serde_yaml_ng::Value, and a plain serde_yaml dep would be a distinct type
# that never unifies with it.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
async-trait = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Pinned to the exact version the root workspace pins, so the `ServerHandler`
# trait the tests bring into scope is the one the MCP crates implement.
rmcp = { version = "=3.9.0", features = ["server"] }
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
# Pinned to the version core signs with, so the tokens this suite mints for the
# hook audiences validate against core's own decoder.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

# Mirrors the root workspace's local-core override set. `[patch]` only applies
# from the manifest of the workspace being built, and tests/ is a separate
# workspace, so without this the test crates resolve core from crates.io while
# the extensions under test resolve it from the local checkout. It is inert
# here; `scripts/core-patch.sh on` renames this table to [patch.crates-io] in
# both manifests. Keep this block in lockstep with the root.
[workspace.metadata.unreleased-core-patch]
systemprompt-provider-contracts = { path = "../../core-f-compose/crates/shared/provider-contracts" }
systemprompt-identifiers = { path = "../../core-f-compose/crates/shared/identifiers" }
systemprompt-traits = { path = "../../core-f-compose/crates/shared/traits" }
systemprompt-models = { path = "../../core-f-compose/crates/shared/models" }

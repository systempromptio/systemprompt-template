systemprompt-manifest = { path = "../../core-f-compose/crates/shared/manifest" }
systemprompt-client = { path = "../../core-f-compose/crates/shared/client" }
systemprompt-extension = { path = "../../core-f-compose/crates/shared/extension" }
systemprompt-template-provider = { path = "../../core-f-compose/crates/shared/template-provider" }
systemprompt-database = { path = "../../core-f-compose/crates/infra/database" }
systemprompt-storage = { path = "../../core-f-compose/crates/infra/storage" }
systemprompt-logging = { path = "../../core-f-compose/crates/infra/logging" }
systemprompt-config = { path = "../../core-f-compose/crates/infra/config" }

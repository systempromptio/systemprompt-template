[package]
name = "admin-db-core-tests"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `full` links the core extension crates whose `register_extension!` supplies
# the users / ai_requests / governance migrations these repositories query;
# `systemprompt-web-extension` pulls in the web schema (user_profile_ext,
# departments, plugin_usage_*) the admin repositories own.
systemprompt = { workspace = true, features = ["full"] }
systemprompt-web-admin = { workspace = true }
systemprompt-web-extension = { workspace = true }

chrono = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

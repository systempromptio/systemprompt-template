# Local-dev + CI default cargo config.
#
# Linker is pinned to `clang` for a slightly faster linker than GNU ld.
# If you want mold for a big local-dev speedup, set it via a *personal*
# override (uncomment the RUSTFLAGS line in your shell profile or use a
# local .cargo/config.toml.local). Baking `-fuse-ld=mold` into the tracked
# config forced every CI container and every new developer to install mold
# before anything compiled.
#
#   export RUSTFLAGS="-C link-arg=-fuse-ld=mold"

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[env]
SQLX_OFFLINE = { value = "true", force = false }
# The linker is already pinned to clang above, and aws-lc-sys needs it as the
# C compiler too (GCC <10 hits bug #95189). Every C build script records CC in
# its fingerprint, so a recipe that exported CC while another did not made
# cargo rebuild aws-lc, rustls, reqwest, rmcp and everything above them on
# each switch between `just build` and `just test-*`. One value here, for
# every cargo invocation, keeps the shared target/ warm.
CC = { value = "clang", force = false }
CXX = { value = "clang++", force = false }

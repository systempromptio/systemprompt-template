# site: the public site and content pipeline, no AI
# Read by scripts/flavour.py (the only reader); docs/flavours/README.md
# describes every key.
name: site
description: "The public site and content pipeline (pages, documentation, sitemap) with files and PDF export and the base console; no AI"
cargo_feature: flavour-site
extra_features: []
binaries:
  - systemprompt
services:
  - access-control
  - config
  - content
  - governance
  - scheduler
  - skills
  - web
requires_ai_key: false
site: true
runtime: slim

smoke:
  routes_present:
    - "/"
    - "/blog"
    - "/documentation"
    - "/sitemap.xml"
    - "/robots.txt"
    - "/llms.txt"
    - "/.well-known/jwks.json"
    - "/admin"
    - "/admin/login"
    - "/css/admin-bundle.css"
    - "/js/pages/admin-login.js"
    - "/js/services/webauthn-helpers.js"
    - "/js/utils/storage-safe.js"
  routes_absent:
    - "/api/v1/mcp/registry"
    - "/api/v1/marketplace"
    # /api/v1/agents/* is not listed: the kernel's agent proxy answers it
    # (401 without a token, 404 for the registry with one), so an
    # unauthenticated probe cannot tell an absent registry from a guarded one.
    - "/api/v1/agent-runs"
    - "/api/v1/brain"
    - "/api/public/connectors"
  cli_groups_present:
    - "admin"
    - "analytics"
    - "core"
    - "infra"
    - "plugins"
    - "web"
    - "build"
  cli_groups_absent:
    - "cloud"
    - "admin agents"
  capabilities:
    - "publish_pipeline"
    - "content_analytics_aggregation"
    - "markdown_content"
  mcp_servers: []
  # The gateway member is in the kernel floor, so /v1/models is served; with
  # no AI member it lists no model ({"data":[],"has_more":false}).
  models_endpoint: true
  console_pages:
    - "/admin"
    - "/admin/users"
    - "/admin/governance"
    - "/admin/configuration"
    - "/admin/system/observability"
  routes_absent_signed_in:
    - "/admin/conversations"
    - "/admin/sessions"
    - "/admin/history"
    - "/admin/requests"
    - "/admin/analytics"
    - "/admin/groups"
    - "/admin/projects"

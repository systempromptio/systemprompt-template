# full: everything the template builds
# Read by scripts/flavour.py (the only reader); docs/flavours/README.md
# describes every key.
name: full
description: "Everything: AI gateway, hosted MCP, agents, public site and the whole admin console"
cargo_feature: flavour-full
extra_features: []
binaries:
  - systemprompt
services:
  - access-control
  - agents
  - ai
  - artifacts
  - config
  - content
  - external_agents
  - gateway
  - governance
  - hooks
  - marketplaces
  - mcp
  - plugins
  - scheduler
  - skills
  - slack
  - web
requires_ai_key: true
site: true
runtime: full

smoke:
  routes_present:
    - "/"
    - "/blog"
    - "/documentation"
    - "/sitemap.xml"
    - "/robots.txt"
    - "/llms.txt"
    - "/.well-known/jwks.json"
    - "/admin"
    - "/admin/login"
    - "/css/admin-bundle.css"
    - "/js/pages/admin-login.js"
  routes_absent:
    - "/__flavour-smoke-absent__"
  cli_groups_present:
    - "admin"
    - "analytics"
    - "build"
    - "cloud"
    - "infra"
    - "plugins"
    - "core"
    - "web"
    - "admin agents"
    - "admin mcp"
    - "admin agent-host"
    - "admin bridge"
    - "admin issues"
  cli_groups_absent: []
  capabilities:
    - "publish_pipeline"
    - "content_analytics_aggregation"
    - "markdown_content"
    - "agent_tasks"
    - "mcp_tool_executions"
  mcp_servers:
    - "systemprompt"
  models_endpoint: true
  console_pages:
    - "/admin"
    - "/admin/users"
    - "/admin/conversations"
    - "/admin/sessions"
    - "/admin/history"
    - "/admin/analysis/versions"
    - "/admin/configuration"
    - "/admin/system/observability"

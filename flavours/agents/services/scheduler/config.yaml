# Scheduler configuration for the agents flavour: replaces
# services/scheduler/config.yaml when this flavour's services tree is staged.
# It lists only the jobs this flavour compiles; core refuses to boot when a
# configured job has no contributing member. services/scheduler/config.yaml
# documents each job.

scheduler:
  enabled: true
  jobs:
    - name: oauth_cleanup
      extension: core
      owner: admin
      schedule: "0 5 3 * * *"
      enabled: true

    - name: user_rate_limit_prune
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enforce: true
      enabled: true

    - name: cleanup_anonymous_users
      extension: core
      owner: admin
      schedule: "0 0 3 * * *"
      enabled: true

    - name: cleanup_inactive_sessions
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true

    - name: database_cleanup
      extension: core
      owner: admin
      schedule: "0 0 4 * * *"
      enabled: true

    - name: no_js_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: ghost_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: file_ingestion
      extension: core
      owner: admin
      enabled: true

    - name: behavioral_analysis
      extension: core
      owner: admin
      enabled: true

    - name: malicious_ip_blacklist
      extension: core
      owner: admin
      enabled: true

    - name: usage_anomaly
      extension: web
      owner: admin
      enabled: true

    - name: usage_daily_rollup
      extension: web
      owner: admin
      enabled: true

    - name: scope_defaults_recompute
      extension: web
      owner: admin
      enabled: true

    - name: access_expiry
      extension: web
      owner: admin
      enabled: true

    - name: secret_migration
      extension: web
      owner: admin
      enabled: true

    - name: plugin_usage_retention
      extension: web
      owner: admin
      enabled: true

    - name: retention_daily_report
      extension: web
      owner: admin
      schedule: "0 30 4 * * *"
      enabled: true

    - name: retention_export_weekly
      extension: web
      owner: admin
      schedule: "0 0 2 * * 0"
      enabled: true

    - name: retention_export_monthly
      extension: web
      owner: admin
      schedule: "0 30 2 1 * *"
      enabled: true

    - name: thought_signature_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: quota_month_window
      extension: web
      owner: admin
      enabled: true

    - name: managed_inventory_refresh
      extension: core
      owner: admin
      schedule: "0 * * * * *"
      enabled: true

    - name: mcp_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: cleanup_empty_contexts
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true

    - name: conversation_judge
      extension: web
      owner: admin
      schedule: "0 */5 * * * *"
      enabled: true
      parameters:
        provider: gemini
        model: gemini-3.5-flash
        batch_size: "20"
        daily_cost_cap_microdollars: "2000000"
        quiet_minutes: "30"

    - name: conversation_rollup
      extension: web
      owner: admin
      enabled: true

  bootstrap_jobs:
    - governance_bootstrap
    - managed_inventory_refresh
    - database_cleanup
    - cleanup_inactive_sessions
    - bundle_admin_css
    - copy_extension_assets

# agents: agents and agent runs on the gateway and MCP hosting
# Read by scripts/flavour.py (the only reader); docs/flavours/README.md
# describes every key.
name: agents
description: "Agents and agent runs on top of the gateway and MCP hosting, with notifications and organisational memory; no public site"
cargo_feature: flavour-agents
extra_features: []
binaries:
  - systemprompt
services:
  - access-control
  - agents
  - ai
  - artifacts
  - config
  - external_agents
  - gateway
  - governance
  - hooks
  - marketplaces
  - mcp
  - plugins
  - scheduler
  - skills
  - web
requires_ai_key: true
site: false
runtime: slim

smoke:
  routes_present:
    - "/"
    - "/.well-known/jwks.json"
    - "/admin"
    - "/admin/login"
    - "/css/admin-bundle.css"
    - "/js/pages/admin-login.js"
    - "/api/v1/mcp/registry"
    - "/api/v1/agents/registry"
  routes_absent:
    - "/sitemap.xml"
    - "/robots.txt"
    - "/llms.txt"
    - "/blog"
    - "/documentation"
    - "/api/public/links"
    - "/api/public/search"
  cli_groups_present:
    - "admin"
    - "analytics"
    - "core"
    - "infra"
    - "plugins"
    - "web"
    - "cloud"
    - "build"
    - "admin agents"
    - "admin agent-host"
    - "admin mcp"
    - "admin bridge"
  cli_groups_absent:
    - "admin issues"
  capabilities:
    - "conversation_judge"
    - "cleanup_empty_contexts"
    - "agent_tasks"
    - "mcp_tool_executions"
  mcp_servers:
    - "systemprompt"
  models_endpoint: true
  root_redirect: "/admin"
  console_pages:
    - "/admin"
    - "/admin/traces"
    - "/admin/conversations"

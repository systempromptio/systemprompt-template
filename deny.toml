[graph]
targets = []

[advisories]
# Transitive unmaintained crates (GTK3 bindings, ttf-parser under the bridge
# GUI stack) are upstream's to replace; only direct dependencies error.
unmaintained = "workspace"
ignore = [
    # rsa crate Marvin Attack - no patch available yet, used transitively by oauth2/webauthn-rs
    # Tracked at: https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
    { id = "RUSTSEC-2026-0543", reason = "`chrono` 0.4.45 is unmaintained; every version is affected and there is no upgrade to take. It is a direct dependency of both workspaces: timestamp columns decode through sqlx's `chrono` feature and core's public model types carry `DateTime<Utc>`, so the template follows core's time types. Maintenance status only; no vulnerability is reported against 0.4.45. Mirrors core's deny.toml at the pinned rev. Exit: drop the ignore when core moves its time types to `jiff` or `time`." },
    { id = "RUSTSEC-2026-0387", reason = "Timing variation in constant-time operations of `crypto-bigint` 0.5.5. Pulled only by `jsonwebtoken` 11.1.0's `rust_crypto` backend through `p256`/`p384` 0.13 -> `ecdsa`/`elliptic-curve` 0.13 (via core's oauth/mcp crates and the test workspace); the fix is crypto-bigint >=0.7.6, which needs elliptic-curve 0.14, and jsonwebtoken 11.1.0 is the latest release and pins the 0.13 line, so there is no upgrade to take. The vulnerable arithmetic runs only for ES256/ES384 keys; neither core nor this repo constructs one (RSA or HMAC keys, RS256/HS256 validation only), and jsonwebtoken refuses a key whose family does not match the algorithm. Not reachable. Mirrors core's deny.toml at the pinned rev. Exit: drop the ignore when jsonwebtoken moves to elliptic-curve 0.14." },
]

[licenses]
# Workspace members are unpublished (publish = false) client code, not
# licensed artifacts; only third-party licenses are checked.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT-0",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BUSL-1.1",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # Data-only license on Unicode character tables (finl_unicode, transitive)
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

services:
  - type: web
    name: systemprompt-gateway
    runtime: image
    plan: starter
    autoDeploy: false  # button-deployed instances shouldn't redeploy on every push to this repo
    image:
      # :0 tracks published releases. Render pulls once at deploy time, so an instance
      # stays pinned to whatever digest it booted with until it is redeployed.
      url: ghcr.io/systempromptio/systemprompt-template:0
    healthCheckPath: /api/v1/health
    disk:
      name: systemprompt-state
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SYSTEMPROMPT_DATA_DIR
        value: /app/data
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: OAUTH_AT_REST_PEPPER
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: systemprompt-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: systemprompt-postgres
    plan: basic-256mb
    diskSizeGB: 5
    ipAllowList: []
    postgresMajorVersion: "17"
